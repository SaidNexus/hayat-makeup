<div class="flex flex-col gap-4 sm:gap-6">
  @for (group of groups; track group.title) {
    <section
      class="overflow-hidden rounded-[14px] border border-[#EEEEEE] bg-white sm:rounded-[18px] md:rounded-[22px]"
    >
      <h2
        class="
          border-b
          border-[#EEEEEE]
          px-3
          py-2.5
          text-start
          text-[11px]
          font-medium
          text-[#888888]

          sm:px-4
          sm:text-[13px]
        "
      >
        {{ group.titleKey ? (group.titleKey | translate) : group.title }}
      </h2>

      @for (item of group.items; track item.id) {
        <app-account-menu-item
          [icon]="item.icon"
          [label]="item.label"
          [labelKey]="item.labelKey"
          [badge]="item.badge"
          (itemClick)="onNavigate(item.to)"
        ></app-account-menu-item>
      }
    </section>
  }

  <!-- Logout -->
  <button
    type="button"
    (click)="onLogout()"
    class="
      flex
      w-full
      items-center
      justify-center
      gap-2
      rounded-[12px]
      border
      border-[#E8B5CF82]
      py-3
      text-[#D4146A]

      sm:rounded-[16px]
      sm:py-4
    "
  >
    <svg
      [lucideIcon]="logOutIcon"
      class="h-4 w-4 sm:h-5 sm:w-5"
      [strokeWidth]="1.6"
    ></svg>

    <span
      class="
        text-[13px]
        font-medium
        leading-none

        sm:text-[16px]
      "
    >
      {{ 'ACCOUNT.LOGOUT' | translate }}
    </span>
  </button>
</div>
