<div dir="rtl" class="min-h-screen bg-white pb-20 lg:pb-10">
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6">
    <!-- Title -->
    <section class="text-center space-y-2">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
        سياسة الخصوصية
      </h1>

      <p class="mx-auto max-w-2xl text-xs sm:text-sm leading-relaxed text-gray-500">
        خصوصيتك تهمنا. توضح هذه السياسة كيف نجمع معلوماتك الشخصية ونستخدمها ونحميها عند استخدامك تطبيق
        <span class="text-[#D4146A] font-semibold"> HAYAT Makeup</span>
      </p>
    </section>

    <!-- Privacy Cards with explicit gaps -->
    <section class="w-full max-w-4xl mx-auto flex flex-col gap-3 sm:gap-4">
      @for (item of privacyItems; track item.title) {
        <app-privacy-card
          [title]="item.title"
          [description]="item.description"
          [icon]="item.icon"
        ></app-privacy-card>
      }
    </section>

    <!-- Notice -->
    <div class="w-full max-w-4xl mx-auto">
      <app-privacy-notice></app-privacy-notice>
    </div>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
