<section class="mt-4">
  <div class="grid grid-cols-2 gap-2 sm:gap-4 md:grid-cols-3 lg:grid-cols-4 lg:gap-6">
    @for (product of filteredProducts(); track product.id) {
      <app-new-arrival-product-card
        [product]="product"
        (selectProduct)="onProductSelect(product.id)"
      ></app-new-arrival-product-card>
    }
  </div>
</section>
