<section class="pb-1">

    class="
      mb-1
      text-right
      text-[15px]
      font-semibold

      sm:mb-4
      sm:text-[25px]

      md:text-[32px]
    "
  >
    الأكثر قراءة

  <div

      grid-cols-2

      <app-most-read-card [article]="article"></app-most-read-card>
    }
  </div>
