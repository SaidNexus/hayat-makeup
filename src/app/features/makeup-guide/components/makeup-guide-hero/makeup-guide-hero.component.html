<section
  class="
    relative
    mb-2
    min-h-[150px]
    overflow-hidden
    rounded-2xl
    bg-[#fff2f5]

    sm:min-h-[210px]
    sm:rounded-[18px]

    md:min-h-[290px]

    lg:min-h-[350px]
  "
>
  <!-- Image -->
  <img
    [src]="heroImage"
    alt=""
    class="
      absolute
      bottom-0
      left-0
      h-full
      w-[47%]
      object-contain
      object-left
      pointer-events-none

      sm:w-[46%]

      md:w-[45%]
    "
  />

  <!-- Content -->
  <div
    class="
      absolute
      inset-y-0
      right-[5%]
      flex
      w-[50%]
      flex-col
      items-start
      justify-center
      text-right

      sm:right-[6%]
      sm:w-[47%]

      md:right-[7%]
      md:w-[46%]
    "
  >
    <p
      class="
        text-xs
        font-semibold
        text-[#C91F72]

        sm:text-[13px]

        md:text-[17px]

        lg:text-[20px]
      "
    >
      دليلك اليومي للجمال
    </p>

    <h2
      class="
        mt-1
        text-base
        font-bold
        leading-tight
        text-[#111]

        sm:text-[25px]

        md:text-[34px]

        lg:text-[42px]
      "
    >
      تعلمي أسرار المكياج
    </h2>

    <p
      class="
        mt-1
        text-[11px]
        text-[#666]

        sm:text-[12px]

        md:text-[16px]

        lg:text-[18px]
      "
    >
      خطوة بخطوة مع خبرائنا
    </p>

    <button
      type="button"
      (click)="navigateToProducts()"
      class="
        mt-2.5
        flex
        h-9
        items-center
        justify-center
        gap-1
        rounded-xl
        bg-[#C91F72]
        px-4
        text-xs
        font-bold
        text-white
        shadow-sm
        transition-all
        hover:bg-[#B01A63]
        active:scale-[0.98]
        cursor-pointer

        sm:mt-5
        sm:h-[38px]
        sm:px-6
        sm:text-[12px]

        md:h-[46px]
        md:px-8
        md:text-[15px]

        lg:h-[52px]
        lg:px-10
        lg:text-[17px]
      "
    >
      اكتشفي المزيد
    </button>
  </div>
</section>
