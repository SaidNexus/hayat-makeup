<div dir="rtl" class="min-h-screen bg-white pb-20 lg:pb-10">
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6">
    <!-- Page Title -->
    <section class="flex flex-col items-center text-center space-y-2">
      <div class="flex items-center justify-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-pink-50 text-[#D4146A]">
          <svg
            [lucideIcon]="truckIcon"
            class="h-6 w-6"
            [strokeWidth]="1.6"
          ></svg>
        </div>

        <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
          سياسة الشحن والتوصيل
        </h1>
      </div>

      <p class="max-w-xl text-xs sm:text-sm text-gray-500 leading-relaxed">
        نحرص على توصيل طلبك بأسرع وقت وبأفضل جودة لتصلك منتجاتك الجميلة أينما كنت.
      </p>
    </section>

    <!-- Shipping Cards with explicit gaps -->
    <section class="w-full max-w-4xl mx-auto flex flex-col gap-3 sm:gap-4">
      @for (section of shippingSections; track section.title) {
        <app-shipping-card [title]="section.title" [icon]="section.icon">
          @for (line of section.lines; track line) {
            <p>{{ line }}</p>
          }
        </app-shipping-card>
      }
    </section>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
