<section dir="rtl" class="mt-3">
  <div class="overflow-hidden rounded-[9px] border border-[#EAEAEA]">
    @for (item of accordionList(); track item.title; let i = $index) {
      <div>
        <button
          type="button"
          (click)="toggle(i)"
          [attr.aria-expanded]="openIndex === i"
          class="
            flex
            h-[30px]
            w-full
            items-center
            justify-between
            border-b
            border-[#EEEEEE]
            px-2.5
            text-right
            last:border-b-0

            sm:h-[47px]
            sm:px-3

            md:h-[57px]
            md:px-4
          "
        >
          <div class="flex items-center gap-1.5">
            <svg
              [lucideIcon]="item.icon"
              class="h-[15px] w-[15px] text-[#111] sm:h-[18px] sm:w-[18px] md:h-[21px] md:w-[21px]"
              [strokeWidth]="1.5"
            ></svg>

            <span
              class="
                text-[9px]
                text-[#333]

                sm:text-[12px]

                md:text-[15px]
              "
            >
              {{ item.title }}
            </span>
          </div>

          <svg
            [lucideIcon]="chevronDownIcon"
            class="
              h-[14px]
              w-[14px]
              transition-transform
              sm:h-[17px]
              sm:w-[17px]
              md:h-[20px]
              md:w-[20px]
            "
            [class.rotate-180]="openIndex === i"
            [strokeWidth]="1.5"
          ></svg>
        </button>

        @if (openIndex === i) {
          <div
            class="
              border-b
              border-[#EEEEEE]
              px-2.5
              pb-3
              pt-1

              sm:px-3

              md:px-4
            "
          >
            <p
              class="
                text-[9px]
                leading-4
                text-[#555]

                sm:text-[12px]
                sm:leading-5

                md:text-[14px]
              "
            >
              {{ item.content }}
            </p>
          </div>
        }
      </div>
    }
  </div>
</section>
