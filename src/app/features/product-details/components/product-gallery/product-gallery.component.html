<div class="w-full">
  <!-- Main Image -->
  <div
    class="
      w-full
      overflow-hidden
      rounded-[10px]

      sm:h-[300px]
      sm:rounded-[14px]

      md:h-[430px]

      lg:h-[520px]
    "
  >
    <img
      [src]="activeImage"
      [alt]="product?.name || 'أحمر شفاه مطفي'"
      class="h-full w-full object-contain"
    />
  </div>

  <!-- Thumbnails -->
  <div
    class="
      mt-2
      flex
      gap-1.5
      overflow-x-auto
      no-scrollbar

      sm:mt-3
      sm:gap-2

      md:gap-3
    "
  >
    @for (image of images.slice(0, 4); track image) {
      <button
        type="button"
        (click)="setActiveImage(image)"
        class="
          h-[43px]
          w-[43px]
          shrink-0
          overflow-hidden
          rounded-[6px]
          border
          bg-white

          sm:h-[64px]
          sm:w-[64px]
          sm:rounded-[8px]

          md:h-[82px]
          md:w-[82px]
        "
        [class.border-[2px]]="activeImage === image"
        [class.border-[#C91F72]]="activeImage === image"
        [class.border-[#EAEAEA]]="activeImage !== image"
      >
        <img
          [src]="image"
          alt=""
          class="h-full w-full object-contain"
        />
      </button>
    }
  </div>
</div>
