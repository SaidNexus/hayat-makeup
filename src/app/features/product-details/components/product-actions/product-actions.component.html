<div
  class="
    mt-3
    grid
    grid-cols-2
    gap-2

    sm:mt-5
    sm:gap-3

    md:mt-7
  "
>
  <button
    type="button"
    (click)="handleAddToCart()"
    class="
      flex
      h-11
      items-center
      justify-center
      gap-1.5
      rounded-xl
      bg-[#C91F72]
      text-xs
      font-bold
      text-white
      shadow-sm
      hover:bg-[#B01A63]
      active:scale-[0.98]
      transition-all
      cursor-pointer

      sm:h-[48px]
      sm:text-[13px]

      md:h-[58px]
      md:text-[16px]
    "
  >
    {{ 'أضف إلى السلة' | localize: 'أضف إلى السلة' : 'Add to Cart' }}
    <svg
      [lucideIcon]="shoppingBagIcon"
      class="h-4 w-4 sm:h-[18px] sm:w-[18px] md:h-[21px] md:w-[21px]"
      [strokeWidth]="1.8"
    ></svg>
  </button>

  <button
    type="button"
    (click)="handleBuyNow()"
    class="
      flex
      h-11
      items-center
      justify-center
      rounded-xl
      border
      border-[#C91F72]
      bg-white
      text-xs
      font-bold
      text-[#C91F72]
      hover:bg-pink-50
      active:scale-[0.98]
      transition-all
      cursor-pointer

      sm:h-[48px]
      sm:text-[13px]

      md:h-[58px]
      md:text-[16px]
    "
  >
    {{ 'اشتري الآن' | localize: 'اشتري الآن' : 'Buy Now' }}
  </button>
</div>
