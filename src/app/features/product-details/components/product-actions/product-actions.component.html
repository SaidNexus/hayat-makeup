<div
  class="
    mt-3
    grid
    grid-cols-2
    gap-2

    sm:mt-5
    sm:gap-3

    md:mt-7
  "
>
  <button
    type="button"
    (click)="handleAddToCart()"
    class="
      flex
      h-[39px]
      items-center
      justify-center
      gap-1
      rounded-[7px]
      bg-[#C91F72]
      !text-[10px]
      font-medium
      text-white

      sm:h-[48px]
      sm:text-[13px]

      md:h-[58px]
      md:text-[16px]
    "
  >
    أضف إلى السلة
    <svg
      [lucideIcon]="shoppingBagIcon"
      class="h-[15px] w-[15px] sm:h-[18px] sm:w-[18px] md:h-[21px] md:w-[21px]"
      [strokeWidth]="1.5"
    ></svg>
  </button>

  <button
    type="button"
    (click)="handleBuyNow()"
    class="
      flex
      h-[39px]
      items-center
      justify-center
      rounded-[7px]
      border
      border-[#C91F72]
      bg-white
      !text-[10px]
      font-medium
      text-[#C91F72]

      sm:h-[48px]
      sm:text-[13px]

      md:h-[58px]
      md:text-[16px]
    "
  >
    اشتري الآن
  </button>
</div>
