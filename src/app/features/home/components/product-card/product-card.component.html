<div
  (click)="onSelect()"
  class="
    group
    relative
    flex
    h-full
    cursor-pointer
    flex-col
    justify-between
    overflow-hidden
    rounded-xl
    sm:rounded-2xl
    border
    border-gray-100
    bg-white
    p-1.5
    sm:p-3
    shadow-sm
    transition-all
    duration-200
    hover:shadow-md
    hover:border-pink-100
  "
>
  <!-- Top: Square Image Area -->
  <div class="relative w-full aspect-square rounded-lg sm:rounded-xl bg-gray-50/60 p-1 sm:p-2 flex items-center justify-center overflow-hidden mb-1.5">
    <img
      [src]="image || fallbackImage"
      [alt]="name"
      (error)="onImgError($event)"
      loading="lazy"
      class="h-full w-full object-contain transition-transform duration-300 group-hover:scale-105"
    />
  </div>

  <!-- Bottom: Info + Button -->
  <div class="flex flex-1 flex-col justify-between space-y-1">
    <div class="text-center">
      <h3 class="text-[10px] sm:text-xs md:text-sm font-bold text-gray-800 line-clamp-1 leading-snug">
        {{ name }}
      </h3>
    </div>

    <!-- Rating + Price Row -->
    <div class="flex items-center justify-between px-0.5 text-[9px] sm:text-xs">
      <span class="text-[11px] sm:text-sm md:text-base font-extrabold text-[#D4146A]">
        {{ price }} <span class="text-[8px] sm:text-xs font-normal">{{ 'COMMON.CURRENCY' | translate }}</span>
      </span>

      <div class="flex items-center gap-0.5 text-[8px] sm:text-xs text-gray-500 font-medium">
        <svg [lucideIcon]="starIcon" class="h-2.5 w-2.5 sm:h-3 sm:w-3 fill-[#F5B546] text-[#F5B546]"></svg>
        <span>({{ reviews }})</span>
      </div>
    </div>

    <!-- Add to Cart Button -->
    <button
      type="button"
      (click)="onAdd($event)"
      class="
        w-full
        h-6
        sm:h-8
        rounded-lg
        bg-[#D4146A]
        text-white
        text-[9px]
        sm:text-xs
        font-bold
        flex
        items-center
        justify-center
        gap-1
        px-1
        shadow-sm
        hover:bg-[#b01057]
        active:scale-[0.98]
        transition-all
      "
    >
      <span class="truncate">{{ 'COMMON.ADD' | translate }}</span>
      <svg [lucideIcon]="cartIcon" class="h-2.5 w-2.5 sm:h-3.5 sm:w-3.5 shrink-0" [strokeWidth]="1.8"></svg>
    </button>
  </div>
</div>
