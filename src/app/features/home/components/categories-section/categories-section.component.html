<section dir="rtl" class="w-full py-1 sm:py-2">
  <div
    class="
      grid
      grid-cols-4
      w-full
      items-start
      justify-items-center
      gap-2
      sm:gap-6
      md:gap-10
      lg:gap-14
      py-1
    "
  >
    @for (category of categories(); track category.name) {
      <div class="w-full flex justify-center">
        <app-category-circle
          [image]="category.image"
          [name]="category.name"
          (categoryClick)="onCategorySelect(category.name)"
        ></app-category-circle>
      </div>
    }
  </div>
</section>
