<section class="w-full" aria-label="Store Benefits">
  <div
    class="
      w-full
      rounded-xl sm:rounded-2xl
      border border-gray-100/90
      bg-white
      py-2.5 sm:py-3.5 md:py-4
      px-1.5 sm:px-4 md:px-6
      shadow-[0_2px_10px_rgba(0,0,0,0.03)]
    "
  >
    <div
      class="w-full items-center"
      [ngClass]="gridClass"
    >
      @for (benefit of processedBenefits; track benefit.id; let i = $index) {
        <div
          class="
            flex
            flex-col sm:flex-row
            items-center
            justify-center
            text-center sm:text-start
            gap-1 sm:gap-2.5 md:gap-3.5
            px-1 sm:px-2 md:px-3
            min-w-0
          "
        >
          <!-- Icon Halo -->
          <div
            class="
              flex
              items-center
              justify-center
              h-8 w-8 sm:h-9 sm:w-9 md:h-10 md:w-10
              rounded-full
              bg-[#FFF0F6]
              text-[#D4146A]
              shrink-0
              shadow-sm
              transition-transform duration-200
            "
          >
            <svg
              [lucideIcon]="getIcon(benefit.icon)"
              class="h-4 w-4 sm:h-4.5 sm:w-4.5 md:h-5 md:w-5"
              [strokeWidth]="1.8"
            ></svg>
          </div>

          <!-- Text Block -->
          <div class="flex flex-col min-w-0 text-center sm:text-start overflow-hidden">
            <span
              class="
                font-bold
                text-[#111111]
                text-[10.5px] sm:text-xs md:text-sm
                leading-tight sm:leading-snug
                break-words
              "
              [title]="benefit.titleAr | localize: benefit.titleAr : benefit.titleEn"
            >
              {{ benefit.titleAr | localize: benefit.titleAr : benefit.titleEn }}
            </span>

            @if (benefit.subtitleEn || benefit.subtitleAr) {
              <span
                class="
                  text-[8.5px] sm:text-[10px] md:text-[11px]
                  text-gray-500
                  font-medium
                  leading-tight
                  break-words
                  mt-0.5
                "
                [title]="benefit.subtitleAr | localize: benefit.subtitleAr : benefit.subtitleEn"
              >
                {{ benefit.subtitleAr | localize: benefit.subtitleAr : benefit.subtitleEn }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
