<section class="w-full">
  <div class="relative w-full overflow-hidden rounded-xl sm:rounded-2xl shadow-sm bg-gray-100">
    <img
      [src]="currentSlide?.image || fallbackHeroImage"
      [alt]="currentSlide?.title || 'Hayat Makeup'"
      (error)="onImgError($event)"
      class="block w-full h-auto max-h-[180px] sm:max-h-[300px] md:max-h-[420px] lg:max-h-[500px] object-cover object-center transition-transform duration-500 hover:scale-[1.01]"
      loading="eager"
    />

    <!-- Dots if multiple slides -->
    <div *ngIf="slides.length > 1" class="absolute bottom-3 inset-x-0 flex justify-center gap-1.5 z-10">
      <button
        *ngFor="let slide of slides; let i = index"
        type="button"
        (click)="setSlide(i)"
        [class.w-6]="i === currentIndex"
        [class.bg-[#D4146A]]="i === currentIndex"
        [class.w-2]="i !== currentIndex"
        [class.bg-white/70]="i !== currentIndex"
        class="h-2 rounded-full transition-all duration-300"
        [attr.aria-label]="'Slide ' + (i + 1)"
      ></button>
    </div>
  </div>
</section>
