<div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4 md:gap-5 lg:gap-6">
  @for (product of products; track product.id) {
    <app-wishlist-product-card
      [product]="product"
      (addToCart)="onAddToCart($event)"
      (removeProduct)="onRemove($event)"
    ></app-wishlist-product-card>
  }
</div>
