<section
  class="
    mx-auto
    flex
    h-[40px]
    w-full
    items-center
    justify-center
    overflow-hidden
    rounded-[5px]
    border
    border-[#EEEEEE]
    bg-white
    px-[1px]
    shadow-[0_1px_5px_rgba(0,0,0,0.04)]

    sm:h-[62px]
    sm:px-[10px]
    sm:rounded-[7px]

    md:h-[76px]
    md:px-[16px]
    md:rounded-[9px]

    lg:h-[88px]
    lg:max-w-[1100px]
    lg:px-[22px]
    lg:rounded-[11px]
  "
>
  <div
    class="
      flex
      w-full
      items-center
      justify-between
    "
  >
    @for (feature of features; track feature.id; let i = $index) {
      <!-- Feature -->
      <div
        class="
          flex
          flex-1
          items-center
          justify-center
          gap-[4px]

          sm:gap-[6px]

          md:gap-[8px]

          lg:gap-[10px]
        "
      >
        <!-- Icon -->
        <svg
          [lucideIcon]="feature.icon"
          class="
            h-[22px]
            w-[22px]
            shrink-0
            text-[#D4146A]

            sm:h-[20px]
            sm:w-[20px]

            md:h-[24px]
            md:w-[24px]

            lg:h-[28px]
            lg:w-[28px]
          "
          [strokeWidth]="1.5"
        ></svg>

        <!-- Text -->
        <div class="text-start">
          <h3
            class="
              whitespace-nowrap
              text-[10px]
              font-semibold
              leading-[1.3]
              text-[#111111]

              sm:text-[8px]

              md:text-[10px]

              lg:text-[12px]
            "
          >
            {{ feature.title | localize: feature.titleAr : feature.titleEn }}
          </h3>

          <p
            class="
              mt-[1px]
              whitespace-nowrap
              text-[8px]
              font-normal
              leading-[1.3]
              text-[#484848]

              sm:text-[7px]

              md:text-[8px]

              lg:text-[10px]
            "
          >
            {{ feature.description | localize: feature.descriptionAr : feature.descriptionEn }}
          </p>
        </div>
      </div>

      <!-- Divider -->
      @if (i !== features.length - 1) {
        <div
          class="
            h-[23px]
            w-px
            shrink-0
            bg-[#E5E5E5]

            sm:h-[34px]

            md:h-[42px]

            lg:h-[50px]
          "
        ></div>
      }
    }
  </div>
</section>
