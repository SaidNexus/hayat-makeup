<section
  class="
    mx-auto
    w-full
    rounded-2xl
    border
    border-[#EEEEEE]
    bg-white
    p-3
    sm:py-3.5
    sm:px-6
    shadow-[0_1px_5px_rgba(0,0,0,0.03)]
    lg:max-w-[1100px]
  "
>
  <div
    class="
      grid
      grid-cols-2
      gap-3
      sm:flex
      sm:items-center
      sm:justify-between
      sm:gap-4
      w-full
    "
  >
    @for (feature of features; track feature.id; let i = $index) {
      <!-- Feature -->
      <div
        class="
          flex
          items-center
          gap-2
          sm:gap-2.5
          min-w-0
        "
      >
        <!-- Icon -->
        <div class="flex items-center justify-center h-8 w-8 sm:h-9 sm:w-9 rounded-full bg-pink-50 text-[#D4146A] shrink-0">
          <svg
            [lucideIcon]="feature.icon"
            class="h-4 w-4 sm:h-5 sm:w-5"
            [strokeWidth]="1.7"
          ></svg>
        </div>

        <!-- Text -->
        <div class="text-start min-w-0 overflow-hidden">
          <h3
            class="
              truncate
              text-xs
              font-bold
              text-[#111111]
              sm:text-xs
              md:text-sm
            "
          >
            {{ feature.title | localize: feature.titleAr : feature.titleEn }}
          </h3>

          <p
            class="
              truncate
              text-[10px]
              font-normal
              text-gray-500
              sm:text-[10px]
              md:text-xs
              mt-0.5
            "
          >
            {{ feature.description | localize: feature.descriptionAr : feature.descriptionEn }}
          </p>
        </div>
      </div>

      <!-- Divider for desktop -->
      @if (i !== features.length - 1) {
        <div
          class="
            hidden
            sm:block
            h-8
            w-px
            shrink-0
            bg-gray-100
          "
        ></div>
      }
    }
  </div>
</section>
