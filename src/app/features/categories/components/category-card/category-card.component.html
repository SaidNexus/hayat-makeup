<button
  type="button"
  (click)="onClick()"
  [style.backgroundColor]="bgColor"
  class="
    group
    relative
    flex
    w-full
    overflow-hidden
    rounded-2xl
    border
    border-[#F0E5E9]
    text-start
    transition-all
    duration-300
    hover:shadow-md
    active:scale-[0.98]
    h-32
    sm:h-44
    md:h-56
    lg:h-64
    {{ className }}
  "
>
  <!-- Image - Left -->
  <div class="relative h-full flex-1 overflow-hidden">
    <img
      [src]="image"
      [alt]="title"
      class="
        absolute
        inset-0
        h-full
        w-full
        object-cover
        transition-transform
        duration-300
        group-hover:scale-105
      "
      loading="lazy"
    />
  </div>

  <!-- Text - Right -->
  <div
    class="
      relative
      z-10
      flex
      h-full
      w-[48%]
      flex-col
      items-start
      justify-between
      p-3
      sm:p-5
      md:p-6
      lg:p-8
    "
  >
    <div class="space-y-1">
      <h2
        class="
          text-sm
          sm:text-lg
          md:text-xl
          lg:text-2xl
          font-bold
          leading-tight
          text-[#111111]
        "
      >
        {{ title }}
      </h2>

      @if (description) {
        <p
          class="
            text-[10px]
            sm:text-xs
            md:text-sm
            font-medium
            leading-relaxed
            text-[#555555]
            line-clamp-2
          "
        >
          {{ description }}
        </p>
      }
    </div>

    <div class="mt-auto text-[#D4146A]">
      <svg
        [lucideIcon]="arrowLeftIcon"
        class="
          h-4
          w-4
          sm:h-5
          sm:w-5
          md:h-6
          md:w-6
          transition-transform
          group-hover:-translate-x-1
          rtl-flip
        "
        [strokeWidth]="1.8"
      ></svg>
    </div>
  </div>
</button>
