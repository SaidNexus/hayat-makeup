<section
  class="
    mt-6
    pb-5

    sm:mt-8

    md:mt-10
  "
>
  <!-- Heading -->
  <div
    class="
      mb-3
      flex
      items-end
      justify-between

      sm:mb-4

      md:mb-5
    "
  >
    <div class="text-right">
      <h2
        class="
          text-[12px]
          font-semibold
          text-[#111]

          sm:text-[24px]

          md:text-[31px]
        "
      >
        أحدث المقالات
      </h2>

      <span
        class="
          block
          h-[2px]
          w-[46px]
          rounded-full
          bg-[#C91F72]

          sm:w-[65px]

          md:w-[85px]
        "
      ></span>
    </div>

    <button
      type="button"
      (click)="onShowAll()"
      class="
        flex
        items-center
        !text-[10px]
        font-medium
        text-[#C91F72]

        sm:text-[13px]

        md:text-[17px]
      "
    >
      <span class="text-[13px]">عرض الكل</span>
      <svg
        [lucideIcon]="chevronLeftIcon"
        class="h-5 w-5"
      ></svg>
    </button>
  </div>

  <!-- Articles -->
  <div
    class="
      flex
      flex-col
      gap-2

      sm:gap-3

      md:gap-4
    "
  >
    @for (article of visibleArticles(); track article.id) {
      <app-latest-article-card [article]="article"></app-latest-article-card>
    }
  </div>
</section>
