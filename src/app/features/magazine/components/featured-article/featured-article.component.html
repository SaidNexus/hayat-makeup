<article
  class="
    relative
    mt-4
    min-h-[210px]
    overflow-hidden
    rounded-2xl
    bg-[#FDEBF1]

    sm:mt-7
    sm:min-h-[245px]
    sm:rounded-[18px]

    md:min-h-[330px]
    md:rounded-[22px]

    lg:min-h-[400px]
  "
>
  <!-- Image with subtle overlay for contrast -->
  <img
    [src]="article.image"
    [alt]="article.title"
    class="
      absolute
      bottom-0
      left-0
      h-full
      w-[45%]
      object-cover
      object-center

      sm:w-[50%]

      md:w-[55%]
    "
  />

  <!-- Content -->
  <div
    class="
      absolute
      inset-y-0
      right-0
      flex
      w-[55%]
      flex-col
      justify-center
      px-4
      py-3
      text-start
      z-10

      sm:w-[50%]
      sm:px-6

      md:w-[45%]
      md:px-9

      lg:px-11
    "
  >
    <!-- Badge -->
    <span
      class="
        w-fit
        rounded-lg
        bg-[#fce2ea]
        px-2.5
        py-0.5
        text-[10px]
        font-bold
        text-[#cf2778]

        sm:px-3
        sm:py-1
        sm:text-[11px]

        md:px-4
        md:py-1.5
        md:text-[13px]
      "
    >
      مقال مميز
    </span>

    <!-- Title -->
    <h2
      class="
        mt-1.5
        max-w-[95%]
        text-sm
        font-bold
        leading-snug
        text-gray-900

        sm:mt-3
        sm:max-w-[92%]
        sm:text-[28px]
        sm:leading-[1.2]

        md:text-[38px]

        lg:text-[44px]
      "
    >
      {{ article.title }}
    </h2>

    <!-- Description -->
    <p
      class="
        mt-1
        max-w-[95%]
        line-clamp-2
        text-xs
        leading-relaxed
        text-gray-600

        sm:mt-3
        sm:max-w-[90%]
        sm:text-[12px]
        sm:leading-6

        md:text-[16px]
        md:leading-7

        lg:text-[18px]
      "
    >
      {{ article.description }}
    </p>

    <!-- Button -->
    <button
      type="button"
      class="
        mt-2
        flex
        w-fit
        items-center
        gap-1.5
        text-xs
        font-bold
        text-[#C91F72]
        hover:underline
        cursor-pointer

        sm:mt-4
        sm:gap-2
        sm:text-[13px]

        md:mt-5
        md:text-[17px]
      "
    >
      <span>اقرأ المقال</span>
      <svg
        [lucideIcon]="arrowLeftIcon"
        class="h-3.5 w-3.5 sm:h-[18px] sm:w-[18px] md:h-[21px] md:w-[21px] rtl-flip"
        [strokeWidth]="1.8"
      ></svg>
    </button>
  </div>
</article>
