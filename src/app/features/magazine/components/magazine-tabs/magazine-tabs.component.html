<div
  class="
    mt-3
    w-full
    border-b
    border-[#EEEEEE]
    sm:mt-7
    md:mt-9
  "
>
  <div
    class="
      grid
      w-full
      grid-cols-5
      items-end
    "
  >
    @for (tab of tabs; track tab) {
      <button
        type="button"
        (click)="selectTab(tab)"
        class="
          relative
          flex
          h-[39px]
          min-w-0
          items-center
          justify-center
          whitespace-nowrap
          px-1
          text-center
          !text-[11px]
          font-medium
          text-[#111]

          sm:h-[48px]
          sm:px-2
          sm:text-[13px]

          md:h-[54px]
          md:px-3
          md:text-[16px]
        "
        [class.text-[#C91F72]]="activeTab === tab"
      >
        @if (activeTab === tab) {
          <!-- Active Border -->
          <span
            class="
              absolute
              -inset-x-1
              top-0
              h-[35px]
              rounded-full
              border
              border-[#C91F72]

              sm:inset-x-2
              sm:h-[44px]

              md:h-[50px]
            "
          ></span>

          <!-- Active Underline -->
          <span
            class="
              absolute
              bottom-[-2px]
              left-0
              right-0
              h-[2px]
              bg-[#C91F72]

              sm:h-[4px]
            "
          ></span>
        }

        <span class="relative z-10">{{ tab }}</span>
      </button>
    }
  </div>
</div>
