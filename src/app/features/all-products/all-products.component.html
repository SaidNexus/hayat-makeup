<div
  class="
    min-h-screen
    w-full
    bg-white
    pb-20
    lg:pb-10
  "
>
  <!-- Header -->
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 pt-3 sm:pt-6">
    <!-- Page Header -->
    <section class="mb-3 text-center sm:text-start">
      <h1 class="text-lg sm:text-2xl md:text-3xl font-bold text-[#222222]">
        {{ 'NAV.PRODUCTS' | translate }}
      </h1>

      <p class="mt-1 text-xs sm:text-sm text-gray-500">
        {{ visibleProducts().length }} {{ 'منتج' | localize: 'منتج' : 'products' }}
      </p>
    </section>

    <!-- Filters -->
    <app-products-filters
      [active]="selectedFilter()"
      (filterChange)="onFilterChange($event)"
    ></app-products-filters>

    <!-- Products Grid -->
    <section class="mt-4 grid grid-cols-2 gap-2.5 sm:gap-4 md:grid-cols-3 lg:grid-cols-4 lg:gap-6">
      @for (product of visibleProducts(); track product.id) {
        <app-all-products-card
          [id]="product.id"
          [image]="product.image"
          [name]="product.name"
          [nameAr]="product.nameAr || product.name"
          [nameEn]="product.nameEn || product.name"
          [description]="product.description"
          [descriptionAr]="product.descriptionAr || product.description"
          [descriptionEn]="product.descriptionEn || product.description"
          [price]="product.price"
          [rating]="product.rating"
          [reviews]="product.reviews"
          (selectProduct)="onProductSelect(product.id)"
        ></app-all-products-card>
      }
    </section>
  </main>

  <!-- Mobile Bottom Navigation -->
  <app-mobile-bottom-nav [activeItem]="'categories'"></app-mobile-bottom-nav>
</div>
