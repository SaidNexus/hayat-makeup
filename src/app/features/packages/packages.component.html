<div class="min-h-screen bg-white pb-20 lg:pb-10">
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6">
    <!-- Page Header -->
    <section class="text-center sm:text-start space-y-1">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
        الباقات
      </h1>

      <p class="text-xs sm:text-sm text-gray-500">
        كل ما تحتاجينه في باقة واحدة 💗
      </p>
    </section>

    <!-- Featured Package -->
    @if (featuredPackage()) {
      <app-featured-package [packageItem]="featuredPackage()"></app-featured-package>
    }

    <!-- Regular Packages Grid -->
    <section class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4 md:gap-5 lg:gap-6">
      @for (packageItem of regularPackages(); track packageItem.id) {
        <app-package-card [packageItem]="packageItem"></app-package-card>
      }
    </section>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
