<article
  class="
    relative
    flex
    min-h-[150px]
    overflow-visible
    rounded-md
    border-1
    border-[#C91F72]
    bg-[#FAF1F6]

    sm:min-h-[260px]
    sm:rounded-[22px]
    sm:border-[3px]

    md:min-h-[320px]

    lg:min-h-[360px]
  "
>
  <!-- Badge -->
  <div
    class="
      absolute
      top-2
      left-1  
      mb-1.5
      flex
      w-fit
      items-center
      gap-1
      rounded-[4px]
      bg-[#C91F72]
      px-2.5
      py-1
      text-[9px]
      font-medium
      text-white

      sm:mb-2
      sm:gap-1.5
      sm:px-4
      sm:py-1.5
      sm:text-[13px]

      md:text-[15px]
    "
  >
    <svg
      [lucideIcon]="starIcon"
      class="h-[9px] w-[9px] sm:h-[13px] sm:w-[13px] md:h-[15px] md:w-[15px] fill-white text-white"
    ></svg>
    <span>الأكثر طلبًا</span>
  </div>

  <!-- Content -->
  <div
    class="
      flex
      min-w-0
      flex-1
      flex-col
      justify-center
      px-3
      py-2

      sm:px-6
      sm:py-5

      md:px-8
      md:py-6
    "
  >
    <h2
      class="
        text-[20px]
        font-bold
        leading-tight
        text-[#151515]

        sm:text-[30px]

        md:text-[38px]

        lg:text-[42px]
      "
    >
      {{ packageItem.name }}
    </h2>

    <p
      class="
        mt-1
        line-clamp-2
        text-[11px]
        leading-relaxed
        text-[#666]

        sm:text-[14px]

        md:text-[17px]
      "
    >
      {{ packageItem.description }}
    </p>

    <div
      class="
        mt-2
        flex
        items-center
        justify-between
        gap-1

        sm:mt-4

        md:mt-5
      "
    >
      <div
        class="
          flex
          items-center
          gap-1
          text-[9px]
          font-medium
          text-[#151515]

          sm:gap-1.5
          sm:text-[13px]

          md:text-[16px]
        "
      >
        <svg
          [lucideIcon]="shoppingBagIcon"
          class="h-[10px] w-[10px] sm:h-[17px] sm:w-[17px] md:h-[20px] md:w-[20px]"
          [strokeWidth]="1.6"
        ></svg>
        <span>{{ packageItem.products }} منتجات</span>
      </div>

      <div
        class="
          flex
          items-center
          gap-1
          rounded-md
          bg-[#FCE4EE]
          px-2
          py-1
          text-[9px]
          font-semibold
          text-[#C91F72]

          sm:gap-1.5
          sm:px-3
          sm:py-1.5
          sm:text-[12px]

          md:text-[15px]
        "
      >
        <svg
          [lucideIcon]="tagIcon"
          class="h-[10px] w-[10px] sm:h-[14px] sm:w-[14px] md:h-[17px] md:w-[17px]"
          [strokeWidth]="1.8"
        ></svg>
        <span>وفري {{ packageItem.discount }}%</span>
      </div>
    </div>

    <div
      class="
        mt-2
        border-t
        border-[#ECECEC]
        pt-2

        sm:mt-4
        sm:pt-4

        md:mt-5
        md:pt-5
      "
    >
      <div class="flex items-center justify-start gap-1.5 sm:gap-2.5">
        <span
          class="
            text-[15px]
            font-bold
            text-[#C91F72]

            sm:text-[32px]

            md:text-[40px]
          "
        >
          {{ packageItem.price }} ر.س
        </span>

        <span
          class="
            text-[10px]
            text-[#a3a3a3]
            line-through

            sm:text-[15px]

            md:text-[18px]
          "
        >
          {{ packageItem.oldPrice }} ر.س
        </span>
      </div>

      <button
        type="button"
        (click)="onAddToCart()"
        class="
          mt-2
          flex
          h-9
          w-full
          items-center
          justify-center
          gap-1.5
          rounded-xl
          bg-[#C91F72]
          px-3
          text-xs
          font-bold
          text-white
          shadow-sm
          transition-all
          hover:bg-[#B01A63]
          active:scale-[0.98]
          cursor-pointer

          sm:mt-3
          sm:h-[46px]
          sm:px-4
          sm:text-[14px]

          md:h-[54px]
          md:text-[17px]
        "
      >
        <span class="flex-1 text-center">أضيفي الباقة</span>
        <svg
          [lucideIcon]="chevronLeftIcon"
          class="h-4 w-4 sm:h-[18px] sm:w-[18px] md:h-[21px] md:w-[21px]"
          [strokeWidth]="1.8"
        ></svg>
      </button>
    </div>
  </div>

  <!-- Image -->
  <div
    class="
      relative
      flex
      w-[49%]
      shrink-0
      items-end
      justify-center

      sm:w-[46%]

      md:w-[48%]
    "
  >
    <img
      [src]="packageItem.image"
      [alt]="packageItem.name"
      class="
        h-[130px]
        w-full
        translate-y-2
        object-contain
        scale-110
        sm:h-[240px]
        sm:translate-y-4

        md:h-[300px]
        md:translate-y-5

        lg:h-[330px]
      "
    />
  </div>
</article>
