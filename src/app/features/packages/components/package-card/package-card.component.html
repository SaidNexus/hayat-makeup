<article
  class="
    min-w-0
    flex
    flex-col
    justify-between
    overflow-hidden
    rounded-2xl
    border
    border-gray-100
    bg-white
    p-3
    sm:p-4
    shadow-sm
    hover:shadow-md
    transition-all
  "
>
  <!-- Top Content -->
  <div class="flex min-w-0 flex-row gap-2">
    <!-- Info -->
    <div class="flex min-w-0 flex-1 flex-col justify-center text-start space-y-1">
      <!-- Title -->
      <h2 class="text-xs sm:text-sm md:text-base font-bold text-gray-900 line-clamp-1">
        {{ packageItem.name }}
      </h2>

      <!-- Description -->
      <p class="text-[10px] sm:text-xs text-gray-500 line-clamp-2 leading-relaxed">
        {{ packageItem.description }}
      </p>

      <!-- Products Count & Discount Badge -->
      <div class="flex items-center justify-between gap-1 pt-1">
        <div class="flex items-center gap-1 text-[10px] sm:text-xs text-gray-500 font-medium">
          <svg
            [lucideIcon]="shoppingBagIcon"
            class="h-3.5 w-3.5 text-[#D4146A]"
            [strokeWidth]="1.5"
          ></svg>
          <span>منتجات</span>
        </div>

        <div class="rounded-full bg-pink-50 px-2 py-0.5 text-[9px] sm:text-xs font-bold text-[#D4146A]">
          وفري %{{ packageItem.discount }}
        </div>
      </div>

      <!-- Price -->
      <div class="flex items-center gap-2 pt-1">
        <span class="text-xs sm:text-sm md:text-base font-extrabold text-[#D4146A]">
          {{ packageItem.price }} <span class="text-[10px] font-normal">ر.س</span>
        </span>

        @if (packageItem.oldPrice) {
          <span class="text-[10px] text-gray-400 line-through">
            {{ packageItem.oldPrice }} ر.س
          </span>
        }
      </div>
    </div>

    <!-- Image -->
    <div class="w-[42%] shrink-0 flex items-center justify-center p-1 bg-gray-50/50 rounded-xl overflow-hidden">
      <img
        [src]="packageItem.image"
        [alt]="packageItem.name"
        class="h-24 sm:h-28 w-full object-contain"
        loading="lazy"
      />
    </div>
  </div>

  <!-- Button -->
  <button
    type="button"
    (click)="onAddToCart()"
    class="
      mt-3
      w-full
      h-9
      sm:h-10
      rounded-xl
      border
      border-[#D4146A]
      bg-white
      text-[#D4146A]
      text-xs
      sm:text-sm
      font-bold
      flex
      items-center
      justify-center
      gap-1.5
      hover:bg-pink-50
      active:scale-[0.98]
      transition-all
      cursor-pointer
    "
  >
    <span>أضيفي الباقة</span>
    <svg
      [lucideIcon]="chevronLeftIcon"
      class="h-3.5 w-3.5"
      [strokeWidth]="1.8"
    ></svg>
  </button>
</article>
