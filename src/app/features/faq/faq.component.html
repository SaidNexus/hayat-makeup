<div
  class="
    min-h-screen
    bg-white
    pb-20
    lg:pb-10
  "
>
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6">
    <!-- Page Title -->
    <section class="text-center space-y-1">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
        الأسئلة الشائعة
      </h1>

      <p class="text-xs sm:text-sm text-gray-500">
        كل ما تحتاجين معرفته عن منتجاتنا وخدماتنا
      </p>
    </section>

    <!-- Search -->
    <section class="w-full max-w-2xl mx-auto">
      <app-faq-search
        [value]="query()"
        (valueChange)="query.set($event)"
      ></app-faq-search>
    </section>

    <!-- FAQ List -->
    <section class="w-full max-w-4xl mx-auto">
      <app-faq-list
        [items]="filteredItems()"
        [openId]="openId()"
        (toggle)="handleToggle($event)"
      ></app-faq-list>
    </section>

    <!-- Support Card -->
    <section class="w-full max-w-4xl mx-auto">
      <app-faq-support-card></app-faq-support-card>
    </section>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
