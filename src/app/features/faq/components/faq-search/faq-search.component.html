<div class="relative w-full">
  <svg
    [lucideIcon]="searchIcon"
    class="
      absolute
      start-4
      top-1/2
      -translate-y-1/2
      text-[#999999]
      h-[18px]
      w-[18px]

      sm:h-[22px]
      sm:w-[22px]

      md:start-5
    "
    [strokeWidth]="1.6"
  ></svg>

  <input
    type="search"
    inputMode="search"
    [value]="value"
    (input)="onInput($event)"
    placeholder="إبحث عن سؤال..."
    aria-label="Search"
    class="
      h-[46px]
      w-full
      rounded-full
      border
      border-[#EEEEEE]
      bg-white
      py-2
      ps-[46px]
      pe-[44px]
      text-[12px]
      leading-none
      text-[#111111]
      outline-none
      placeholder:text-[#999999]
      focus:border-[#D4146A]

      sm:h-[54px]
      sm:ps-[54px]
      sm:pe-[52px]
      sm:text-[14px]

      md:h-[60px]
      md:text-[16px]
    "
  />

  @if (value) {
    <button
      type="button"
      aria-label="Clear search"
      (click)="onClear()"
      class="
        absolute
        end-4
        top-1/2
        flex
        -translate-y-1/2
        items-center
        justify-center
        text-[#999999]

        md:end-5
      "
    >
      <svg
        [lucideIcon]="xIcon"
        class="h-[18px] w-[18px] sm:h-[22px] sm:w-[22px]"
        [strokeWidth]="1.6"
      ></svg>
    </button>
  }
</div>
