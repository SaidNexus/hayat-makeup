<div class="relative w-full">
  <svg
    [lucideIcon]="searchIcon"
    class="
      absolute
      right-4
      top-1/2
      -translate-y-1/2
      text-[#999999]
      h-[18px]
      w-[18px]

      sm:h-[22px]
      sm:w-[22px]

      md:right-5
    "
    [strokeWidth]="1.6"
  ></svg>

  <input
    dir="rtl"
    type="search"
    inputMode="search"
    [value]="value"
    (input)="onInput($event)"
    placeholder="إبحث عن سؤال..."
    aria-label="بحث"
    class="
      h-[46px]
      w-full
      rounded-full
      border
      border-[#EEEEEE]
      bg-white
      py-2
      pl-[44px]
      pr-[46px]
      text-[12px]
      leading-none
      text-[#111111]
      outline-none
      placeholder:text-[#999999]
      focus:border-[#D4146A]

      sm:h-[54px]
      sm:pl-[52px]
      sm:pr-[54px]
      sm:text-[14px]

      md:h-[60px]
      md:text-[16px]
    "
  />

  @if (value) {
    <button
      type="button"
      aria-label="مسح البحث"
      (click)="onClear()"
      class="
        absolute
        left-4
        top-1/2
        flex
        -translate-y-1/2
        items-center
        justify-center
        text-[#999999]

        md:left-5
      "
    >
      <svg
        [lucideIcon]="xIcon"
        class="h-[18px] w-[18px] sm:h-[22px] sm:w-[22px]"
        [strokeWidth]="1.6"
      ></svg>
    </button>
  }
</div>
