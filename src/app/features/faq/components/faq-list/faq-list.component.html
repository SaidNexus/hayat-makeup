<div class="flex w-full flex-col gap-2 sm:gap-3 md:gap-4">
  @if (items.length > 0) {
    @for (faq of items; track faq.id) {
      <app-faq-item
        [faq]="faq"
        [open]="openId === faq.id"
        (toggle)="onToggle($event)"
      ></app-faq-item>
    }
  } @else {
    <section
      class="
        flex
        flex-col
        items-center
        justify-center
        py-10
        text-center

        sm:py-14
      "
    >
      <div
        class="
          flex
          h-[60px]
          w-[60px]
          items-center
          justify-center
          rounded-full
          bg-[#FBE3EF]
          text-[#D4146A]

          sm:h-[76px]
          sm:w-[76px]
        "
      >
        <svg
          [lucideIcon]="searchXIcon"
          class="h-7 w-7 sm:h-[36px] sm:w-[36px]"
          [strokeWidth]="1.4"
        ></svg>
      </div>

      <p
        class="
          mt-3
          text-[13px]
          font-medium
          text-[#111111]

          sm:mt-4
          sm:text-[18px]
        "
      >
        لا توجد نتائج مطابقة
      </p>

      <p
        class="
          mt-1
          text-[10px]
          text-[#888888]

          sm:mt-2
          sm:text-[13px]
        "
      >
        جربي كلمة بحث أخرى.
      </p>
    </section>
  }
</div>
