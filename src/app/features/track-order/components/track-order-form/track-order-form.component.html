<form
  dir="rtl"
  (submit)="onSubmit($event)"
  class="
    flex
    w-full
    flex-col
    gap-2

    sm:gap-3
  "
>
  <label
    for="track-order-input"
    class="
      text-right
      text-[12px]
      font-medium
      text-[#111111]

      sm:text-[16px]
    "
  >
    رقم الطلب
  </label>

  <div class="relative">
    <input
      id="track-order-input"
      dir="ltr"
      type="text"
      inputMode="numeric"
      [value]="value"
      (input)="onInput($event)"
      placeholder="10245"
      aria-label="رقم الطلب"
      class="
        h-[46px]
        w-full
        rounded-[12px]
        border
        border-[#EEEEEE]
        bg-white
        py-2
        pl-4
        pr-11
        text-right
        text-[13px]
        leading-none
        text-[#111111]
        outline-none
        placeholder:text-[#999999]
        focus:border-[#D4146A]

        sm:h-[56px]
        sm:text-[16px]

        md:h-[62px]
      "
    />

    <svg
      [lucideIcon]="searchIcon"
      class="
        absolute
        right-3.5
        top-1/2
        -translate-y-1/2
        text-[#999999]
        h-[18px]
        w-[18px]

        sm:h-[22px]
        sm:w-[22px]
      "
      [strokeWidth]="1.6"
    ></svg>
  </div>

  <button
    type="submit"
    [disabled]="loading || !value.trim()"
    class="
      mt-1
      flex
      h-[46px]
      w-full
      items-center
      justify-center
      gap-2
      rounded-[12px]
      bg-[#D4146A]
      text-[15px]
      font-medium
      leading-none
      text-white
      transition-opacity
      hover:opacity-90
      disabled:cursor-not-allowed
      disabled:opacity-50

      sm:h-[56px]
      sm:text-[18px]

      md:h-[62px]
    "
  >
    @if (loading) {
      <svg
        [lucideIcon]="loaderIcon"
        class="h-[18px] w-[18px] animate-spin"
      ></svg>
    }

    <span>تتبع الطلب</span>
  </button>
</form>
