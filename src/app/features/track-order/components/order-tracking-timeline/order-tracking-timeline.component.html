<section
  dir="rtl"
  class="
    w-full
    rounded-[14px]
    border
    border-[#EEEEEE]
    bg-white
    px-4
    py-4

    sm:rounded-[16px]
    sm:px-6
    sm:py-6

    md:rounded-[18px]
    md:px-8
    md:py-8
  "
>
  <h3
    class="
      text-[14px]
      font-medium
      text-[#111111]

      sm:text-[19px]

      md:text-[22px]
    "
  >
    حالة التتبع
  </h3>

  @if (isCancelled) {
    <div
      class="
        mt-3
        flex
        items-center
        gap-2
        rounded-[10px]
        bg-[#FDECEC]
        px-3
        py-2.5
        text-[#D4146A]

        sm:mt-4
        sm:gap-3
        sm:rounded-[12px]
        sm:px-4
        sm:py-3
      "
    >
      <svg
        [lucideIcon]="xIcon"
        class="shrink-0 h-4 w-4 sm:h-5 sm:w-5"
        [strokeWidth]="1.8"
      ></svg>

      <p
        class="
          text-[11px]
          leading-5

          sm:text-[14px]
        "
      >
        تم إلغاء هذا الطلب.
      </p>
    </div>
  }

  <ol class="mt-4 flex flex-col sm:mt-6">
    @for (row of rows; track row.id; let index = $index) {
      <li class="relative flex gap-3 sm:gap-4">
        <!-- Connector -->
        @if (index < rows.length - 1) {
          <span
            class="
              absolute
              right-[15px]
              top-[30px]
              h-[calc(100%-14px)]
              w-[2px]

              sm:right-[19px]
              sm:top-[38px]

              md:right-[23px]
            "
            [class.bg-[#D4146A]]="row.completed"
            [class.bg-[#F3DCE7]]="!row.completed"
          ></span>
        }

        <!-- Node -->
        <span
          class="
            z-10
            mt-1
            flex
            h-[30px]
            w-[30px]
            shrink-0
            items-center
            justify-center
            rounded-full
            border-2

            sm:mt-1.5
            sm:h-[38px]
            sm:w-[38px]

            md:h-[46px]
            md:w-[46px]
          "
          [class.border-[#F3DCE7]]="isCancelled || (!row.completed && !row.current)"
          [class.bg-[#FAE6EE]]="isCancelled"
          [class.text-[#D4146A]]="isCancelled || row.current"
          [class.border-[#D4146A]]="!isCancelled && (row.completed || row.current)"
          [class.bg-[#D4146A]]="!isCancelled && row.completed"
          [class.text-white]="!isCancelled && row.completed"
          [class.bg-white]="!isCancelled && !row.completed"
        >
          @if (row.completed) {
            <svg
              [lucideIcon]="checkIcon"
              class="h-4 w-4 sm:h-5 sm:w-5 md:h-6 md:w-6"
              [strokeWidth]="2"
            ></svg>
          } @else if (isCancelled) {
            <svg
              [lucideIcon]="xIcon"
              class="h-3.5 w-3.5 sm:h-[18px] sm:w-[18px]"
              [strokeWidth]="2"
            ></svg>
          } @else {
            <span
              class="
                h-[8px]
                w-[8px]
                rounded-full

                sm:h-[10px]
                sm:w-[10px]

                md:h-[12px]
                md:w-[12px]
              "
              [class.bg-[#D4146A]]="row.current"
              [class.bg-[#E5B6CC]]="!row.current"
            ></span>
          }
        </span>

        <!-- Step content -->
        <div
          class="
            flex
            min-w-0
            flex-1
            flex-col
            justify-center
            pb-4

            sm:pb-5

            md:pb-6
          "
          [class.!pb-0]="index === rows.length - 1"
        >
          <span
            class="
              text-[12px]
              font-medium
              leading-5
              text-right

              sm:text-[16px]

              md:text-[19px]
            "
            [class.text-[#999999]]="isCancelled"
            [class.text-[#111111]]="!isCancelled && (row.completed || row.current)"
            [class.text-[#AAAAAA]]="!isCancelled && !row.completed && !row.current"
          >
            {{ row.label }}
          </span>
        </div>
      </li>
    }
  </ol>
</section>
