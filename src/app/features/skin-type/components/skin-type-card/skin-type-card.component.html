<article
  class="
    relative
    grid
    min-h-[72px]
    grid-cols-[28%_46%_26%]
    overflow-hidden
    rounded-[9px]
    border
    border-[#EEEEEE]
    bg-white
    shadow-[0_2px_6px_rgba(0,0,0,0.03)]

    sm:min-h-[100px]
    sm:grid-cols-[32%_44%_24%]
    sm:rounded-[13px]

    md:min-h-[132px]
    md:rounded-[17px]
  "
>
  <!-- Left - Products -->
  <div
    class="
      flex
      items-center
      justify-end
      gap-1
      px-0.5

      sm:gap-0.5
      sm:px-1

      md:gap-1
      md:px-2
    "
  >
    @for (product of item.products; track product) {
      <img
        [src]="product"
        alt=""
        class="
          h-[36px]
          w-[23px]
          object-contain

          sm:h-[54px]
          sm:w-[32px]

          md:h-[76px]
          md:w-[44px]
        "
      />
    }
  </div>

  <!-- Center -->
  <div
    class="
      flex
      min-w-0
      flex-col
      justify-center
      px-1
      text-right

      sm:px-1.5

      md:px-3
    "
  >
    <div
      dir="rtl"
      class="
        flex
        items-center
        justify-start
        gap-0.5

        sm:gap-1

        md:gap-1.5
      "
    >
      <svg
        [lucideIcon]="icon"
        class="
          shrink-0
          h-[19px]
          w-[19px]
          text-[#C91F72]

          sm:h-[18px]
          sm:w-[18px]

          md:h-[23px]
          md:w-[23px]
        "
        [strokeWidth]="1.5"
      ></svg>

      <h2
        class="
          truncate
          text-[14px]
          font-semibold
          leading-4
          text-[#111]

          sm:text-[15px]
          sm:leading-5

          md:text-[21px]
          md:leading-6
        "
      >
        {{ item.title }}
      </h2>
    </div>

    <p
      class="
        mt-0.5
        line-clamp-2
        text-[8px]
        leading-3
        text-[#666]

        sm:mt-1
        sm:text-[9px]
        sm:leading-4

        md:text-[12px]
        md:leading-5
      "
    >
      {{ item.description }}
    </p>
  </div>

  <!-- Right - Face -->
  <div
    class="
      relative
      overflow-hidden
      bg-[#FFF0F5]
    "
  >
    <img
      [src]="item.image"
      [alt]="item.title"
      class="
        h-full
        w-full
        object-cover
      "
    />

    <div
      class="
        absolute
        inset-y-0
        left-0
        w-[12px]
        bg-gradient-to-r
        from-[#FFF0F5]
        to-transparent

        sm:w-[18px]

        md:w-[28px]
      "
    ></div>
  </div>

  <!-- Arrow -->
  <button
    type="button"
    [attr.aria-label]="'فتح ' + item.title"
    (click)="navigateToCategory()"
    class="
      absolute
      left-1
      top-1/2
      z-10
      flex
      -translate-y-1/2
      items-center
      justify-center
      text-[#C91F72]

      sm:left-1.5

      md:left-2
    "
  >
    <svg
      [lucideIcon]="chevronLeftIcon"
      class="h-[15px] w-[15px] sm:h-[19px] sm:w-[19px] md:h-[24px] md:w-[24px]"
      [strokeWidth]="1.6"
    ></svg>
  </button>
</article>
