<div
  class="
    mt-4
    w-full
    overflow-hidden

    sm:mt-6
    md:mt-7
  "
>
  <div
    class="
      flex
      w-full
      items-center
      justify-between
      gap-1
    "
  >
    @for (item of colors; track item.id) {
      <button
        type="button"
        (click)="selectColor(item.id)"
        class="
          flex
          min-w-0
          flex-1
          items-center
          justify-center
          gap-1
          rounded-[9px]
          border
          px-1
          h-[30px]
          !text-[8px]
          font-medium
          whitespace-nowrap

          sm:h-[44px]
          sm:gap-2
          sm:px-2
          sm:text-[12px]

          md:h-[50px]
          md:px-3
          md:text-[15px]
        "
        [class.border-[#C91F72]]="activeColor === item.id"
        [class.bg-[#FFF0F5]]="activeColor === item.id"
        [class.text-[#C91F72]]="activeColor === item.id"
        [class.border-[#E5E5E5]]="activeColor !== item.id"
        [class.bg-white]="activeColor !== item.id"
        [class.text-[#111]]="activeColor !== item.id"
      >
        <span
          class="
            h-[9px]
            w-[9px]
            shrink-0
            rounded-full

            sm:h-[16px]
            sm:w-[16px]

            md:h-[20px]
            md:w-[20px]
          "
          [style.backgroundColor]="item.color"
        ></span>

        <span class="truncate">
          {{ item.label }}
        </span>
      </button>
    }
  </div>
</div>
