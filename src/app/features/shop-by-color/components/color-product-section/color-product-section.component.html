<section
  class="
    mt-3
    overflow-hidden
    rounded-2xl
    bg-[#FFF7FA]
    p-3
    sm:p-5
    md:p-6
  "
>
  <!-- Heading -->
  <div class="flex items-start justify-between gap-3">
    <!-- Section title -->
    <div class="min-w-0 text-right">
      <div class="flex items-center justify-start gap-1.5">
        <span
          class="h-2.5 w-2.5 sm:h-3.5 sm:w-3.5 md:h-4 md:w-4 rounded-full"
          [style.backgroundColor]="color"
        ></span>

        <h2 class="text-sm sm:text-lg md:text-xl font-bold text-[#C91F72]">
          {{ title }}
        </h2>
      </div>

      <p class="mt-0.5 text-xs text-gray-500">
        {{ subtitle }}
      </p>
    </div>

    <!-- Show All -->
    <button
      type="button"
      (click)="navigateToProducts()"
      class="flex shrink-0 items-center gap-1 text-xs sm:text-sm font-semibold text-[#C91F72] hover:opacity-80 transition"
    >
      <span>عرض الكل</span>
      <svg
        [lucideIcon]="chevronLeftIcon"
        class="h-3.5 w-3.5 sm:h-4 sm:w-4"
        [strokeWidth]="1.8"
      ></svg>
    </button>
  </div>

  <!-- Products Grid -->
  <div class="mt-3 grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4 md:gap-5 lg:gap-6">
    @for (product of products; track product.id) {
      <app-color-product-card [product]="product"></app-color-product-card>
    }
  </div>
</section>
