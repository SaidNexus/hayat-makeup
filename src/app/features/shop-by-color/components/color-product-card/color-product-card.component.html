<div
  class="
    group
    relative
    flex
    h-full
    cursor-pointer
    flex-col
    justify-between
    overflow-hidden
    rounded-2xl
    border
    border-gray-100
    bg-white
    p-2.5
    sm:p-3.5
    shadow-[0_2px_8px_rgba(0,0,0,0.03)]
    transition-all
    duration-200
    hover:shadow-md
    hover:border-pink-100
  "
>
  <!-- Top: Wishlist + Square Image Area -->
  <div class="relative w-full aspect-square rounded-xl bg-gray-50/60 p-2 flex items-center justify-center overflow-hidden mb-2">
    <!-- Wishlist Button -->
    <button
      type="button"
      (click)="handleFavorite()"
      [attr.aria-label]="isFavorite ? 'إزالة من المفضلة' : 'إضافة للمفضلة'"
      class="
        absolute
        left-1.5
        top-1.5
        z-10
        flex
        h-7
        w-7
        sm:h-8
        sm:w-8
        items-center
        justify-center
        rounded-full
        bg-white/90
        shadow-sm
        transition
        active:scale-90
      "
    >
      <svg
        [lucideIcon]="heartIcon"
        class="h-3.5 w-3.5 sm:h-4 sm:w-4 transition-colors"
        [class.fill-[#D4146A]]="isFavorite"
        [class.text-[#D4146A]]="isFavorite"
        [class.text-gray-400]="!isFavorite"
        [strokeWidth]="1.5"
      ></svg>
    </button>

    <img
      [src]="product.image"
      [alt]="product.name"
      loading="lazy"
      class="h-full w-full object-contain transition-transform duration-300 group-hover:scale-105"
    />
  </div>

  <!-- Bottom: Info + Button -->
  <div class="flex flex-1 flex-col justify-between space-y-1.5">
    <div class="text-center space-y-0.5">
      <h3 class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-1 leading-snug">
        {{ product.name }}
      </h3>
    </div>

    <!-- Price -->
    <div class="flex items-center justify-center px-1 text-xs">
      <span class="text-xs sm:text-sm md:text-base font-extrabold text-[#D4146A]">
        {{ product.price }} <span class="text-[10px] sm:text-xs font-normal">ر.س</span>
      </span>
    </div>

    <!-- Add to Cart Button -->
    <button
      type="button"
      (click)="handleAddToCart()"
      class="
        w-full
        h-8
        sm:h-9
        rounded-xl
        bg-[#D4146A]
        text-white
        text-xs
        sm:text-sm
        font-bold
        flex
        items-center
        justify-center
        gap-1.5
        shadow-sm
        hover:bg-[#b01057]
        active:scale-[0.98]
        transition-all
      "
    >
      <span>أضف للسلة</span>
      <svg [lucideIcon]="shoppingBagIcon" class="h-3.5 w-3.5 shrink-0" [strokeWidth]="1.8"></svg>
    </button>
  </div>
</div>
