<div dir="rtl" class="min-h-screen bg-white pb-20 lg:pb-10 text-[#111]">
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6 sm:space-y-8">
    <!-- Page Header -->
    <section class="text-center sm:text-right space-y-1">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
        التسوق حسب اللون
      </h1>

      <p class="text-xs sm:text-sm text-gray-500">
        تسوقي منتجاتك المفضلة حسب لونك المفضل
      </p>
    </section>

    <!-- Filters -->
    <app-color-filter-tabs
      [activeColor]="activeColor()"
      (colorChange)="onColorChange($event)"
    ></app-color-filter-tabs>

    <!-- Sections -->
    <div class="space-y-8">
      @for (section of visibleSections(); track section.id) {
        <app-color-product-section
          [title]="section.title"
          [subtitle]="section.subtitle"
          [color]="section.color"
          [products]="section.products"
        ></app-color-product-section>
      }
    </div>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
