<section class="mt-3 sm:mt-8 md:mt-10">
  <!-- Heading -->
  <div class="mb-3 text-center sm:mb-4 md:mb-5">
    <h2
      class="
        text-[20px]
        font-semibold
        text-[#111]

        sm:text-[26px]

        md:text-[33px]
      "
    >
      تواصل مباشر
    </h2>

    <span
      class="
        mx-auto
        mt-1
        block
        h-[1px]
        w-[48px]
        rounded-full
        bg-[#C91F72]

        sm:w-[62px]

        md:w-[78px]
      "
    ></span>
  </div>

  <!-- 3 top -->
  <div
    class="
      grid
      grid-cols-3
      gap-1

      sm:gap-3

      md:gap-5
    "
  >
    @for (method of standardMethods; track method.id) {
      <app-contact-method-card
        [icon]="method.icon"
        [title]="method.title"
        [value]="method.value"
        [href]="method.href"
      ></app-contact-method-card>
    }
  </div>

  <!-- 2 bottom -->
  <div
    class="
      mt-1
      grid
      grid-cols-2
      gap-1

      sm:mt-3
      sm:gap-3

      md:mt-5
      md:gap-5
    "
  >
    @for (method of wideMethods; track method.id) {
      <app-contact-method-card
        [icon]="method.icon"
        [title]="method.title"
        [value]="method.value"
        [href]="method.href"
      ></app-contact-method-card>
    }
  </div>
</section>
