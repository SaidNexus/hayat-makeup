<div dir="rtl" class="min-h-screen w-full bg-white pb-20 lg:pb-10">
  <app-header></app-header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Menu Grid -->
    <nav class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4 lg:gap-5">
      @for (item of menuItems; track item.to) {
        <a
          [routerLink]="item.to"
          class="flex h-14 md:h-16 items-center gap-4 rounded-xl border border-[#ECECEC] px-4 transition-all hover:border-[#D4146A]/30 hover:shadow-sm"
          [ngClass]="
            currentPath === item.to
              ? 'border-[#D4146A]/40 bg-[#FBE3EF]/40 text-[#D4146A]'
              : 'bg-white text-[#222222]'
          "
        >
          <svg
            [lucideIcon]="item.icon"
            class="block h-5 w-5 md:h-6 md:w-6 shrink-0"
            [ngClass]="currentPath === item.to ? 'text-[#D4146A]' : 'text-gray-600'"
            [strokeWidth]="1.5"
          ></svg>

          <span
            class="text-sm md:text-base"
            [ngClass]="currentPath === item.to ? 'font-semibold text-[#D4146A]' : 'font-normal text-gray-800'"
          >
            {{ item.label }}
          </span>
        </a>
      }

      <!-- Logout -->
      <button
        type="button"
        routerLink="/"
        class="flex h-14 md:h-16 items-center gap-4 rounded-xl border border-pink-200 bg-pink-50/50 px-4 text-[#D4146A] hover:bg-pink-100/60 transition-all text-right"
      >
        <svg
          [lucideIcon]="LogOut"
          class="block h-5 w-5 md:h-6 md:w-6 shrink-0"
          [strokeWidth]="1.5"
        ></svg>
        <span class="text-sm md:text-base font-medium">
          تسجيل الخروج
        </span>
      </button>
    </nav>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
