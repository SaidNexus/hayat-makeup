<section class="mt-4 sm:mt-6 md:mt-8">
  <div
    class="
      relative
      min-h-[170px]
      overflow-hidden
      rounded-2xl
      bg-[#FFF0F5]

      sm:min-h-[195px]
      sm:rounded-[18px]

      md:min-h-[270px]

      lg:min-h-[320px]
    "
  >
    <img
      [src]="promoImage"
      alt=""
      class="
        absolute
        bottom-0
        left-0
        h-full
        w-[46%]
        object-contain
        object-left-bottom
        pointer-events-none

        sm:w-[50%]

        md:w-[49%]
      "
    />

    <div
      class="
        absolute
        inset-y-0
        right-0
        flex
        w-[54%]
        flex-col
        justify-center
        items-start
        px-4
        text-start

        sm:w-[48%]
        sm:px-6

        md:w-[45%]
        md:px-8
      "
    >
      <span
        class="
          text-xs
          font-bold
          text-[#C91F72]

          sm:text-[11px]

          md:text-[15px]
        "
      >
        ✨ عرض مميز
      </span>

      <h2
        class="
          mt-1
          text-base
          font-bold
          leading-tight
          text-[#111]

          sm:text-[25px]

          md:text-[34px]

          lg:text-[42px]
        "
      >
        طلة متكاملة
      </h2>

      <p
        class="
          mt-1
          text-xs
          leading-relaxed
          text-gray-600

          sm:text-[11px]
          sm:leading-5

          md:text-[15px]
          md:leading-6
        "
      >
        كل ما تحتاجينه لإطلالة متكاملة
        <br />
        مكياج - عناية - أدوات
      </p>

      <button
        type="button"
        (click)="navigateToOffers()"
        class="
          mt-2.5
          flex
          h-9
          w-fit
          items-center
          gap-2
          rounded-xl
          bg-[#C91F72]
          px-4
          text-xs
          font-bold
          text-white
          shadow-sm
          hover:bg-[#B01A63]
          active:scale-[0.98]
          transition-all
          cursor-pointer

          sm:mt-4
          sm:h-[38px]
          sm:px-5
          sm:text-[12px]

          md:h-[46px]
          md:px-7
          md:text-[15px]
        "
      >
        <span>تسوقي الآن</span>

        <svg
          [lucideIcon]="arrowLeftIcon"
          class="h-3.5 w-3.5 sm:h-4 sm:w-4 md:h-[19px] md:w-[19px] rtl-flip"
          [strokeWidth]="1.8"
        ></svg>
      </button>
    </div>
  </div>
</section>
