<div class="relative">
  <svg
    [lucideIcon]="searchIcon"
    class="
      absolute
      start-3
      top-1/2
      -translate-y-1/2
      text-[#999999]
      h-[18px]
      w-[18px]

      sm:h-[22px]
      sm:w-[22px]

      md:start-4
    "
    [strokeWidth]="1.6"
  ></svg>

  <input
    type="search"
    inputMode="search"
    [value]="value"
    (input)="onInput($event)"
    [placeholder]="'ابحثي عن منتجك...' | localize: 'ابحثي عن منتجك...' : 'Search for products...'"
    [attr.aria-label]="'COMMON.SEARCH' | translate"
    class="
      h-[44px]
      w-full
      rounded-full
      border
      border-[#EEEEEE]
      bg-white
      py-2
      pe-[46px]
      ps-[42px]
      text-[12px]
      leading-none
      text-[#111111]
      outline-none
      placeholder:text-[#999999]
      focus:border-[#D4146A]

      sm:h-[52px]
      sm:pe-[54px]
      sm:ps-[52px]
      sm:text-[14px]

      md:h-[58px]
      md:text-[16px]
    "
  />

  @if (value) {
    <button
      type="button"
      [attr.aria-label]="'مسح البحث' | localize: 'مسح البحث' : 'Clear search'"
      (click)="onClear()"
      class="
        absolute
        end-3
        top-1/2
        flex
        -translate-y-1/2
        items-center
        justify-center
        text-[#999999]
        cursor-pointer

        sm:end-4
      "
    >
      <svg
        [lucideIcon]="xIcon"
        class="h-[18px] w-[18px] sm:h-[22px] sm:w-[22px]"
        [strokeWidth]="1.6"
      ></svg>
    </button>
  }
</div>
