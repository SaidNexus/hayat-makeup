<button
  type="button"
  (click)="onClick()"
  class="
    min-w-0
    bg-transparent
    text-center
  "
>
  <div
    class="
      relative
      overflow-visible
      flex
      min-w-0
      flex-col
      items-center
      justify-center
      rounded-[9px]
      bg-white
      py-2

      sm:rounded-[12px]
      sm:px-2
      sm:py-3

      md:rounded-[15px]
      md:px-3
      md:py-4
    "
    [class.border-[2px]]="selected"
    [class.border-[#C91F72]]="selected"
    [class.border]="!selected"
    [class.border-[#DDDDDD]]="!selected"
  >
    <!-- Selected Check -->
    @if (selected) {
      <span
        class="
          absolute
          right-[-7px]
          top-[-7px]
          z-30
          flex
          h-5
          w-5
          items-center
          justify-center
          rounded-full
          bg-[#C91F72]
          text-[10px]
          font-bold
          leading-none
          text-white

          sm:right-[-8px]
          sm:top-[-8px]
          sm:h-7
          sm:w-7
          sm:text-[12px]

          md:right-[-9px]
          md:top-[-9px]
          md:h-8
          md:w-8
          md:text-[13px]
        "
      >
        ✓
      </span>
    }

    <!-- Icon -->
    <svg
      [lucideIcon]="icon"
      class="h-[23px] w-[23px] sm:h-[29px] sm:w-[29px] md:h-[38px] md:w-[38px] text-[#111]"
      [strokeWidth]="1.4"
    ></svg>

    <!-- Title -->
    <h3
      class="
        mt-1
        text-[9px]
        font-medium
        leading-4
        text-[#111]

        sm:mt-1.5
        sm:text-[12px]

        md:mt-2
        md:text-[16px]
      "
    >
      {{ type.label }}
    </h3>

    <!-- Description -->
    <p
      class="
        mt-0.5
        line-clamp-1
        text-[6px]
        leading-3
        text-[#747474]

        sm:mt-1
        sm:text-[9px]
        sm:leading-4

        md:text-[12px]
        md:leading-5
      "
    >
      {{ type.description }}
    </p>
  </div>
</button>
