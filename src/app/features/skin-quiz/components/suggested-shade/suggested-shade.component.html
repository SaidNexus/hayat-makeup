<section
  dir="ltr"
  class="
    mt-2
    w-full
    overflow-hidden
    rounded-[14px]
    border
    border-[#F1D8E2]
    bg-[#FFF0F5]

    sm:mt-5
    sm:rounded-[18px]

    md:mt-6
    md:rounded-[22px]
  "
>
  <div
    class="
      flex
      min-h-[120px]
      items-center
      gap-2
      px-2
      py-2

      sm:min-h-[155px]
      sm:gap-4
      sm:px-5
      sm:py-3

      md:min-h-[195px]
      md:px-7
      md:py-4
    "
  >
    <!-- Product Image - Left -->
    <div
      class="
        flex
        w-[40%]
        shrink-0
        items-center
        justify-center
      "
    >
      <img
        [src]="foundationImage"
        alt="Natural Beige"
        class="
          h-[105px]
          w-full
          object-contain

          sm:h-[135px]

          md:h-[175px]
        "
      />
    </div>

    <!-- Details - Right -->
    <div
      dir="rtl"
      class="
        min-w-0
        flex-1
        text-right
      "
    >
      <!-- Suggested -->
      <div
        class="
          flex
          items-center
          justify-start
          gap-1
          text-[#C91F72]
        "
      >
        <svg
          [lucideIcon]="sparklesIcon"
          class="h-[13px] w-[13px] sm:h-[17px] sm:w-[17px] md:h-5 md:w-5"
          [strokeWidth]="1.4"
        ></svg>

        <span
          class="
            text-[8px]
            font-medium

            sm:text-[11px]

            md:text-[14px]
          "
        >
          درجتك المقترحة
        </span>
      </div>

      <!-- Shade Number -->
      <h2
        class="
          mt-1
          text-[22px]
          font-semibold
          leading-none
          text-[#111]
          text-center
          sm:text-[31px]

          md:text-[42px]
        "
      >
        N220
      </h2>

      <!-- Name -->
      <p
        class="
          mt-1
          text-[9px]
          font-medium
          text-[#111]
          text-center
          sm:text-[13px]

          md:text-[17px]
        "
      >
        Natural Beige
      </p>

      <!-- Description -->
      <p
        class="
          mt-1
          text-[7px]
          leading-4
          text-[#777]
          text-center
          sm:text-[10px]
          sm:leading-5

          md:text-[13px]
        "
      >
        تناسب بشرتك (عادية، محايد، فاتح)
      </p>

      <!-- Shade Colors -->
      <div
        class="
          mt-2
          flex
          justify-center
          gap-1.5

          sm:gap-2

          md:gap-2.5
        "
      >
        @for (color of shades; track color; let i = $index) {
          <span
            class="
              flex
              h-[16px]
              w-[16px]
              items-center
              justify-center
              rounded-full

              sm:h-5
              sm:w-5

              md:h-6
              md:w-6
            "
            [class.border-[1px]]="i === 2"
            [class.border-[#C91F72]]="i === 2"
            [class.p-[1px]]="i === 2"
          >
            <span
              class="h-full w-full rounded-full"
              [style.backgroundColor]="color"
            ></span>
          </span>
        }
      </div>
    </div>
  </div>
</section>
