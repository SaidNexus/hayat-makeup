<div
  dir="rtl"
  class="
    min-h-screen
    bg-white
    pb-20
    lg:pb-10
  "
>
  <app-header></app-header>

  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 space-y-6">
    <!-- Intro -->
    <section class="text-center space-y-2">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#111111]">
        السياسات القانونية
      </h1>

      <p class="mx-auto max-w-2xl text-xs sm:text-sm text-gray-500 leading-relaxed">
        نحرص على الشفافية وحماية حقوقك. يمكنك الاطلاع على جميع السياسات والشروط التي تنظم استخدام متجرنا وخدماتنا.
      </p>

      <div class="flex items-center justify-center gap-3 pt-2">
        <span class="h-[1px] w-12 bg-[#D4146A]"></span>
        <span class="h-2 w-2 rounded-full bg-[#D4146A]"></span>
        <span class="h-[1px] w-12 bg-[#D4146A]"></span>
      </div>
    </section>

    <!-- Policies Cards with explicit gaps -->
    <section class="w-full max-w-4xl mx-auto flex flex-col gap-3 sm:gap-4">
      @for (policy of policies; track policy.id) {
        <button
          dir="ltr"
          type="button"
          (click)="navigateTo(policy.to)"
          class="
            group
            flex
            w-full
            items-center
            justify-between
            rounded-2xl
            border
            border-gray-100
            bg-white
            p-4
            sm:p-5
            shadow-sm
            hover:shadow-md
            transition-all
            cursor-pointer
          "
        >
          <!-- Arrow -->
          <svg
            [lucideIcon]="chevronLeftIcon"
            class="
              h-5
              w-5
              sm:h-6
              sm:w-6
              text-[#D4146A]
              transition-transform
              group-hover:-translate-x-1
            "
            [strokeWidth]="1.8"
          ></svg>

          <!-- Title + Icon -->
          <div class="flex items-center gap-3 sm:gap-4 text-right">
            <span class="text-sm sm:text-base md:text-lg font-bold text-gray-900">
              {{ policy.title }}
            </span>

            <div class="flex h-11 w-11 sm:h-12 sm:w-12 items-center justify-center rounded-2xl bg-pink-50 text-[#D4146A]">
              <svg
                [lucideIcon]="policy.icon"
                class="h-5 w-5 sm:h-6 sm:w-6"
                [strokeWidth]="1.6"
              ></svg>
            </div>
          </div>
        </button>
      }
    </section>

    <!-- Last Updated -->
    <div class="flex items-center justify-center gap-2 text-xs sm:text-sm text-gray-400 pt-4">
      <svg
        [lucideIcon]="calendarDaysIcon"
        class="h-4 w-4 text-[#D4146A]"
        [strokeWidth]="1.6"
      ></svg>
      <span>آخر تحديث: 2026</span>
    </div>
  </main>

  <app-mobile-bottom-nav></app-mobile-bottom-nav>
</div>
