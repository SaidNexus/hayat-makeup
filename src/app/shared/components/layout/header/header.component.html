<header dir="ltr" class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-100 shadow-sm">
  <div class="relative max-w-7xl mx-auto flex items-center justify-between px-3 md:px-6 lg:px-8 h-14 md:h-16 lg:h-20">
    <!-- Menu Button (Left) -->
    <div class="flex items-center">
      <a
        routerLink="/menu"
        aria-label="القائمة"
        class="flex items-center justify-center p-1.5 text-[#111111] hover:text-[#D4146A] transition-colors"
      >
        <svg
          [lucideIcon]="Menu"
          class="block h-5 w-5 md:h-6 md:w-6 lg:h-7 lg:w-7"
          [strokeWidth]="1.5"
        ></svg>
      </a>
    </div>

    <!-- Logo (Dead-Centered Geometrically) -->
    <a
      routerLink="/"
      class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center"
    >
      <img
        src="https://res.cloudinary.com/ddzk9wuye/image/upload/v1787248206/hayat-makeup/hero.png"
        alt="HAYAT MAKEUP"
        class="h-9 sm:h-11 md:h-13 lg:h-15 w-auto object-contain transition-transform hover:scale-105"
      />
    </a>

    <!-- Actions (Right) -->
    <div class="flex items-center gap-2.5 sm:gap-4 md:gap-5 text-[#111111]">
      <!-- Search -->
      <a
        routerLink="/search"
        aria-label="بحث"
        class="flex items-center justify-center p-1.5 hover:text-[#D4146A] transition-colors"
      >
        <svg
          [lucideIcon]="Search"
          class="block h-5 w-5 md:h-6 md:w-6 lg:h-7 lg:w-7"
          [strokeWidth]="1.5"
        ></svg>
      </a>

      <!-- Cart -->
      <a
        routerLink="/cart"
        class="relative flex items-center justify-center p-1.5 hover:text-[#D4146A] transition-colors"
        aria-label="السلة"
      >
        <svg
          [lucideIcon]="ShoppingBag"
          class="block h-5 w-5 md:h-6 md:w-6 lg:h-7 lg:w-7"
          [strokeWidth]="1.5"
        ></svg>

        @if (cartService.totalItems() > 0) {
          <span
            class="absolute -top-1 -right-1 bg-[#D4146A] text-white text-[9px] md:text-[10px] font-bold rounded-full h-4 w-4 md:h-4.5 md:w-4.5 flex items-center justify-center shadow-sm"
          >
            {{ cartService.totalItems() }}
          </span>
        }
      </a>

      <!-- User Account -->
      <a
        routerLink="/account"
        aria-label="الحساب"
        class="flex items-center justify-center p-1.5 hover:text-[#D4146A] transition-colors"
      >
        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="currentColor"
          stroke-width="0.2"
          class="block h-5 w-5 md:h-6 md:w-6 lg:h-7 lg:w-7"
        >
          <g id="User">
            <path
              d="M17.438,21.937H6.562a2.5,2.5,0,0,1-2.5-2.5V18.61c0-3.969,3.561-7.2,7.938-7.2s7.938,3.229,7.938,7.2v.827A2.5,2.5,0,0,1,17.438,21.937ZM12,12.412c-3.826,0-6.938,2.78-6.938,6.2v.827a1.5,1.5,0,0,0,1.5,1.5H17.438a1.5,1.5,0,0,0,1.5-1.5V18.61C18.938,15.192,15.826,12.412,12,12.412Z"
            ></path>
            <path
              d="M12,9.911a3.924,3.924,0,1,1,3.923-3.924A3.927,3.927,0,0,1,12,9.911Zm0-6.847a2.924,2.924,0,1,0,2.923,2.923A2.926,2.926,0,0,0,12,3.064Z"
            ></path>
          </g>
        </svg>
      </a>
    </div>
  </div>
</header>
