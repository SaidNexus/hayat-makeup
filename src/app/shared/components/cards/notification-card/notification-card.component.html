<article
  (click)="onClick()"
  class="
    relative
    flex
    w-full
    items-center
    gap-3
    sm:gap-4
    rounded-2xl
    border
    border-gray-100
    bg-white
    p-3.5
    sm:p-4
    md:p-5
    shadow-sm
    hover:shadow-md
    transition-all
    cursor-pointer
  "
>
  <!-- Unread Indicator Dot -->
  @if (!notification.read) {
    <span
      class="
        absolute
        left-3
        top-3
        sm:left-4
        sm:top-4
        h-2
        w-2
        sm:h-2.5
        sm:w-2.5
        rounded-full
        bg-[#D4146A]
      "
    ></span>
  }

  <!-- Icon Circle -->
  <div
    class="
      flex
      h-11
      w-11
      sm:h-12
      sm:w-12
      md:h-14
      md:w-14
      shrink-0
      items-center
      justify-center
      rounded-full
      bg-pink-50
      text-[#D4146A]
    "
  >
    <svg
      [lucideIcon]="icon"
      class="h-5 w-5 sm:h-6 sm:w-6"
      [strokeWidth]="1.6"
    ></svg>
  </div>

  <!-- Content -->
  <div class="min-w-0 flex-1 text-right space-y-0.5 sm:space-y-1">
    <h2
      class="
        text-xs
        sm:text-sm
        md:text-base
        font-bold
        text-gray-900
      "
    >
      {{ notification.title }}
    </h2>

    <p
      class="
        text-[11px]
        sm:text-xs
        md:text-sm
        text-gray-600
        leading-relaxed
        line-clamp-2
      "
    >
      {{ notification.description }}
    </p>

    <p
      class="
        text-[10px]
        sm:text-xs
        text-gray-400
        pt-0.5
      "
    >
      {{ notification.time }}
    </p>
  </div>
</article>
