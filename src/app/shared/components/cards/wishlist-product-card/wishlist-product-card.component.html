<div class="relative flex min-w-0 flex-col overflow-hidden rounded-[8px] border border-[#E8E8E8] bg-white">
  <!-- Favorite -->
  <button
    type="button"
    [attr.aria-label]="'FAVORITES.REMOVE' | translate"
    (click)="onRemove()"
    class="absolute start-2 top-1 z-10"
  >
    <svg
      [lucideIcon]="heartIcon"
      class="h-5 w-5 text-[#D41472] fill-[#D41472]"
      [strokeWidth]="0"
    ></svg>
  </button>

  <!-- Image -->
  <div class="flex h-[130px] items-center justify-center px-4 pt-1">
    <img
      [src]="product.image"
      [alt]="product.name"
      class="h-full w-full object-contain"
    />
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col px-3 pb-1 pt-1 text-center">
    <h3 class="text-[11px] leading-5 text-[#222]">{{ product.name }}</h3>

    <p class="text-[9px] leading-3 text-[#555]">{{ product.variant }}</p>

    <p class="text-[9px] text-[#4BA65A]">{{ 'COMMON.INSTOCK' | translate }}</p>

    <div>
      <span class="mx-1 text-[15px] font-medium text-[#111]">
        {{ product.price }}
      </span>
      <span class="text-[14px] text-[#222]">{{ 'COMMON.CURRENCY' | translate }}</span>
    </div>

    <!-- Add To Cart -->
    <button
      type="button"
      (click)="onAddToCart()"
      class="mt-1 flex h-[25px] w-full items-center justify-center gap-2 rounded-[6px] border border-[#D41472] bg-white !text-[12px] text-[#D41472] cursor-pointer hover:bg-pink-50 transition-colors"
    >
      <svg
        [lucideIcon]="shoppingCartIcon"
        class="h-[13px] w-[13px]"
        [strokeWidth]="1.5"
      ></svg>
      <span>{{ 'أضف إلى السلة' | localize: 'أضف إلى السلة' : 'Add to Cart' }}</span>
    </button>
  </div>
</div>
