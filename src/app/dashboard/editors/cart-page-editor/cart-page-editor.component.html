<div class="w-full flex flex-col gap-4 pb-24" dir="rtl">
  <div class="text-center mb-2">
    <h2 class="text-xl font-bold text-gray-900 mb-1">سلة التسوق</h2>
    <p class="text-sm text-gray-500">تحكم في عناصر وتصميم ونصوص سلة التسوق</p>
  </div>

  <app-section-card 
    title="رأس الصفحة" 
    [index]="0" 
    [enabled]="true" 
    [isFirst]="true" 
    [isLast]="false"
    (click)="onCardClick()"
    (focusin)="onCardClick()"
  >
    <app-bilingual-input 
      title="عنوان الصفحة" 
      labelAr="عربي / AR" 
      labelEn="English / EN" 
      [valueAr]="config.headerTitleAr || config.headerTitle || ''" 
      [valueEn]="config.headerTitleEn || ''" 
      (valueChange)="updateBilingualField('headerTitle', $event.lang, $event.value)"
    ></app-bilingual-input>
  </app-section-card>

  <app-section-card 
    title="عناصر السلة" 
    [index]="1" 
    [enabled]="true" 
    [isFirst]="false" 
    [isLast]="false"
    (click)="onCardClick()"
    (focusin)="onCardClick()"
  >
    <div class="grid grid-cols-2 gap-2">
      <label class="flex items-center justify-between p-2 bg-gray-50 rounded-md border border-gray-100 cursor-pointer hover:bg-gray-100 transition-colors">
        <span class="text-sm text-gray-700">صورة المنتج</span>
        <div class="relative inline-flex items-center">
          <input 
            type="checkbox" 
            class="sr-only peer" 
            [ngModel]="!!config.showProductImage" 
            (ngModelChange)="updateConfig({ showProductImage: $event })" 
          />
          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-[#D4146A] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
        </div>
      </label>

      <label class="flex items-center justify-between p-2 bg-gray-50 rounded-md border border-gray-100 cursor-pointer hover:bg-gray-100 transition-colors">
        <span class="text-sm text-gray-700">أزرار الكمية</span>
        <div class="relative inline-flex items-center">
          <input 
            type="checkbox" 
            class="sr-only peer" 
            [ngModel]="!!config.showQuantityControls" 
            (ngModelChange)="updateConfig({ showQuantityControls: $event })" 
          />
          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-[#D4146A] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
        </div>
      </label>

      <label class="flex items-center justify-between p-2 bg-gray-50 rounded-md border border-gray-100 cursor-pointer hover:bg-gray-100 transition-colors">
        <span class="text-sm text-gray-700">زر الحذف</span>
        <div class="relative inline-flex items-center">
          <input 
            type="checkbox" 
            class="sr-only peer" 
            [ngModel]="!!config.showRemoveButton" 
            (ngModelChange)="updateConfig({ showRemoveButton: $event })" 
          />
          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-[#D4146A] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
        </div>
      </label>
    </div>
  </app-section-card>

  <app-section-card 
    title="كود الخصم" 
    [index]="2" 
    [enabled]="config.showCouponSection" 
    [isFirst]="false" 
    [isLast]="false"
    (onToggle)="updateConfig({ showCouponSection: $event })"
    (click)="onCardClick()"
    (focusin)="onCardClick()"
  >
    <div *ngIf="config.showCouponSection" class="flex flex-col gap-2">
      <app-bilingual-input 
        title="عنوان القسم" 
        labelAr="عربي / AR" 
        labelEn="English / EN" 
        [valueAr]="config.couponTitleAr || config.couponTitle || ''" 
        [valueEn]="config.couponTitleEn || ''" 
        (valueChange)="updateBilingualField('couponTitle', $event.lang, $event.value)"
      ></app-bilingual-input>

      <app-bilingual-input 
        title="النص الإرشادي (Placeholder)" 
        labelAr="عربي / AR" 
        labelEn="English / EN" 
        [valueAr]="config.couponPlaceholderAr || config.couponPlaceholder || ''" 
        [valueEn]="config.couponPlaceholderEn || ''" 
        (valueChange)="updateBilingualField('couponPlaceholder', $event.lang, $event.value)"
      ></app-bilingual-input>

      <app-bilingual-input 
        title="نص زر التطبيق" 
        labelAr="عربي / AR" 
        labelEn="English / EN" 
        [valueAr]="config.couponButtonTextAr || config.couponButtonText || ''" 
        [valueEn]="config.couponButtonTextEn || ''" 
        (valueChange)="updateBilingualField('couponButtonText', $event.lang, $event.value)"
      ></app-bilingual-input>
    </div>
  </app-section-card>

  <app-section-card 
    title="ملخص الطلب" 
    [index]="3" 
    [enabled]="true" 
    [isFirst]="false" 
    [isLast]="false"
    (click)="onCardClick()"
    (focusin)="onCardClick()"
  >
    <div class="grid grid-cols-2 gap-2 mb-4">
      <label class="flex items-center justify-between p-2 bg-gray-50 rounded-md border border-gray-100 cursor-pointer hover:bg-gray-100 transition-colors">
        <span class="text-sm text-gray-700">المجموع الفرعي</span>
        <div class="relative inline-flex items-center">
          <input 
            type="checkbox" 
            class="sr-only peer" 
            [ngModel]="!!config.showSubtotal" 
            (ngModelChange)="updateConfig({ showSubtotal: $event })" 
          />
          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-[#D4146A] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
        </div>
      </label>
      <label class="flex items-center justify-between p-2 bg-gray-50 rounded-md border border-gray-100 cursor-pointer hover:bg-gray-100 transition-colors">
        <span class="text-sm text-gray-700">رسوم الشحن</span>
        <div class="relative inline-flex items-center">
          <input 
            type="checkbox" 
            class="sr-only peer" 
            [ngModel]="!!config.showShipping" 
            (ngModelChange)="updateConfig({ showShipping: $event })" 
          />
          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-[#D4146A] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
        </div>
      </label>
    </div>
    <app-bilingual-input 
      title="نص زر إتمام الطلب" 
      labelAr="عربي / AR" 
      labelEn="English / EN" 
      [valueAr]="config.checkoutButtonTextAr || config.checkoutButtonText || ''" 
      [valueEn]="config.checkoutButtonTextEn || ''" 
      (valueChange)="updateBilingualField('checkoutButtonText', $event.lang, $event.value)"
    ></app-bilingual-input>
  </app-section-card>

  <app-section-card 
    title="شارات الثقة" 
    [index]="4" 
    [enabled]="config.showTrustBadges" 
    [isFirst]="false" 
    [isLast]="true"
    (onToggle)="updateConfig({ showTrustBadges: $event })"
    (click)="onCardClick()"
    (focusin)="onCardClick()"
  >
    <div *ngIf="config.showTrustBadges" class="flex flex-col gap-3">
      <div *ngFor="let badge of config.trustBadges; let idx = index; trackBy: trackByFn" class="bg-gray-50 border border-gray-200 rounded-lg p-3">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-200">
          <span class="text-xs font-bold text-gray-600">الشارة {{ idx + 1 }}</span>
          <button (click)="removeTrustBadge(idx)" class="text-red-400 hover:text-red-600 p-1" title="حذف">
            <lucide-icon [img]="TrashIcon" [size]="16"></lucide-icon>
          </button>
        </div>
        <app-bilingual-input 
          title="عنوان الشارة" 
          labelAr="عربي / AR" 
          labelEn="English / EN" 
          [valueAr]="badge.titleAr || badge.title || ''" 
          [valueEn]="badge.titleEn || ''" 
          (valueChange)="updateTrustBadge(idx, { titleAr: $event.lang === 'Ar' ? $event.value : badge.titleAr, titleEn: $event.lang === 'En' ? $event.value : badge.titleEn, title: $event.lang === 'Ar' ? $event.value : badge.title })"
        ></app-bilingual-input>

        <app-bilingual-input 
          title="وصف الشارة" 
          labelAr="عربي / AR" 
          labelEn="English / EN" 
          [valueAr]="badge.subtitleAr || badge.subtitle || ''" 
          [valueEn]="badge.subtitleEn || ''" 
          (valueChange)="updateTrustBadge(idx, { subtitleAr: $event.lang === 'Ar' ? $event.value : badge.subtitleAr, subtitleEn: $event.lang === 'En' ? $event.value : badge.subtitleEn, subtitle: $event.lang === 'Ar' ? $event.value : badge.subtitle })"
        ></app-bilingual-input>
      </div>
      <button 
        (click)="addTrustBadge()"
        class="text-xs bg-pink-50 text-[#D4146A] py-2 px-3 rounded-lg hover:bg-pink-100 font-bold border border-pink-200 transition-colors w-fit"
      >
        + إضافة شارة ثقة
      </button>
    </div>
  </app-section-card>
</div>
