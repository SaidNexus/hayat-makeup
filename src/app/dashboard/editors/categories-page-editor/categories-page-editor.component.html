<div class="space-y-6 pb-20" dir="rtl">
  <div>
    <h2 class="text-xl font-bold text-gray-900">صفحة التصنيفات</h2>
    <p class="text-sm text-gray-500 mt-1">تخصيص العناوين والبانر الترويجي.</p>
  </div>

  <div class="space-y-4">
    <!-- Header Texts -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">عناوين الصفحة</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">العنوان الرئيسي</label>
          <input
            type="text"
            [ngModel]="config.headerTitle"
            (ngModelChange)="updateConfig('headerTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">عنوان التصنيفات الرئيسية</label>
          <input
            type="text"
            [ngModel]="config.mainCategoriesTitle"
            (ngModelChange)="updateConfig('mainCategoriesTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">عنوان تصفح حسب التصنيف</label>
          <input
            type="text"
            [ngModel]="config.browseCategoriesTitle"
            (ngModelChange)="updateConfig('browseCategoriesTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- Promo Banner -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">البانر الترويجي</h3>
      
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">عرض البانر الترويجي</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.promoBannerVisible"
              (ngModelChange)="updateConfig('promoBannerVisible', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
        
        <ng-container *ngIf="config.promoBannerVisible">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">عنوان البانر</label>
            <input
              type="text"
              [ngModel]="config.promoBannerTitle"
              (ngModelChange)="updateConfig('promoBannerTitle', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">النص الوصفي للبانر</label>
            <input
              type="text"
              [ngModel]="config.promoBannerSubtitle"
              (ngModelChange)="updateConfig('promoBannerSubtitle', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">نص الزر</label>
            <input
              type="text"
              [ngModel]="config.promoBannerButtonText"
              (ngModelChange)="updateConfig('promoBannerButtonText', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
        </ng-container>
      </div>
    </div>

  </div>
</div>
