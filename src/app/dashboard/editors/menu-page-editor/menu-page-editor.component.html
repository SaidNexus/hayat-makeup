<div class="space-y-6 pb-20" dir="rtl">
  <div>
    <h2 class="text-xl font-bold text-gray-900">صفحة القائمة (Menu)</h2>
    <p class="text-sm text-gray-500 mt-1">تخصيص عناصر القائمة الجانبية للتطبيق.</p>
  </div>

  <div class="space-y-4">
    <!-- Basic Texts -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">النصوص الأساسية</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">نص زر تسجيل الخروج</label>
          <input
            type="text"
            [ngModel]="config.logoutText"
            (ngModelChange)="handleChange('logoutText', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- Menu Items -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">عناصر القائمة الجانبية</h3>
      
      <div class="space-y-2">
        <ng-container *ngFor="let item of config.menuItems">
          <div class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 bg-gray-50">
            <div class="flex-1 min-w-0">
              <input
                type="text"
                [ngModel]="item.label"
                (ngModelChange)="handleChangeMenuItem(item.id, $event)"
                class="w-full px-2 py-1.5 text-sm border border-transparent hover:border-gray-300 focus:border-pink-500 rounded bg-transparent focus:bg-white transition-all"
                [ngClass]="!item.visible ? 'opacity-50' : ''"
              />
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button
                (click)="handleToggleMenuItem(item.id)"
                class="p-1.5 rounded-md hover:bg-white transition"
                [ngClass]="item.visible ? 'text-pink-600' : 'text-gray-400'"
                [title]="item.visible ? 'إخفاء' : 'إظهار'"
              >
                <lucide-icon [img]="item.visible ? Eye : EyeOff" [size]="16"></lucide-icon>
              </button>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
