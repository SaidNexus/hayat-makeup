<div class="space-y-4">
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">رأس الصفحة (Header)</div>
    <div class="p-4 space-y-4">
      <div class="space-y-3 p-4">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">عنوان الصفحة</span>
          <input
            type="text"
            [ngModel]="config.headerTitle"
            (ngModelChange)="updateConfig('headerTitle', $event)"
            class="lk-input h-10 px-3 rounded-xl border border-border"
          />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">وصف الصفحة</span>
          <input
            type="text"
            [ngModel]="config.headerSubtitle"
            (ngModelChange)="updateConfig('headerSubtitle', $event)"
            class="lk-input h-10 px-3 rounded-xl border border-border"
          />
        </label>
      </div>
    </div>
  </div>

  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">الأقسام المعروضة</div>
    <div class="p-4 space-y-4">
      <div class="space-y-3 p-4">
        <label class="flex items-center justify-between">
          <span class="text-sm font-medium">إظهار قسم الصورة الشخصية</span>
          <input
            type="checkbox"
            [ngModel]="config.showAvatarSection"
            (ngModelChange)="updateConfig('showAvatarSection', $event)"
            class="lk-checkbox"
          />
        </label>
        <label class="flex items-center justify-between">
          <span class="text-sm font-medium">إظهار قسم البيانات الأساسية</span>
          <input
            type="checkbox"
            [ngModel]="config.showBasicInfoSection"
            (ngModelChange)="updateConfig('showBasicInfoSection', $event)"
            class="lk-checkbox"
          />
        </label>
        <label class="flex items-center justify-between">
          <span class="text-sm font-medium">إظهار قسم العنوان</span>
          <input
            type="checkbox"
            [ngModel]="config.showAddressSection"
            (ngModelChange)="updateConfig('showAddressSection', $event)"
            class="lk-checkbox"
          />
        </label>
      </div>
    </div>
  </div>
</div>
