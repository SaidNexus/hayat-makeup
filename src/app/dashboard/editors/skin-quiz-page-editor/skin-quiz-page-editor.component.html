<div class="w-full flex flex-col gap-2 pb-24" dir="rtl">
  <div class="text-center mb-4">
    <h2 class="text-xl font-bold text-gray-900 mb-1">اختبار البشرة</h2>
    <p class="text-sm text-gray-500">تخصيص محتوى اختبار البشرة</p>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden p-4 space-y-4">
    <div class="flex items-center justify-between border-b pb-2">
      <h3 class="font-bold text-gray-900">رأس الصفحة</h3>
      <label class="relative inline-flex items-center cursor-pointer">
        <input 
          type="checkbox" 
          class="sr-only peer" 
          [ngModel]="config.showQuizHeader ?? true" 
          (ngModelChange)="updateConfig({ showQuizHeader: $event })" 
        />
        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-pink-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
      </label>
    </div>
    
    <div *ngIf="config.showQuizHeader !== false" class="mt-2">
      <div class="flex flex-col gap-1.5 mb-2">
        <span class="text-xs font-bold text-gray-700">عنوان الاختبار</span>
        <input 
          type="text" 
          class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500"
          [ngModel]="config.quizTitle || ''" 
          (ngModelChange)="updateConfig({ quizTitle: $event })"
        />
      </div>
      <div class="flex flex-col gap-1.5 mb-2">
        <span class="text-xs font-bold text-gray-700">النص الإرشادي</span>
        <input 
          type="text" 
          class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500"
          [ngModel]="config.quizDescription || ''" 
          (ngModelChange)="updateConfig({ quizDescription: $event })"
        />
      </div>
    </div>
  </div>
</div>
