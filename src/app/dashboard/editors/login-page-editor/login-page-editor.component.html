<div class="space-y-4">
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">القسم الترحيبي (Hero)</div>
    <div class="p-4 space-y-3">
      <div class="flex flex-col gap-1.5 mb-3">
        <span class="text-sm font-medium">صورة البانر (الخلفية)</span>
        <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-100">
          <div class="w-16 h-16 rounded-md overflow-hidden flex items-center justify-center bg-gray-200">
            <img *ngIf="config().heroImage" [src]="config().heroImage" alt="Banner" class="w-full h-full object-cover" />
            <lucide-icon *ngIf="!config().heroImage" [img]="ImageIcon" class="text-gray-400"></lucide-icon>
          </div>
          <button (click)="changeHeroImage()" class="flex items-center gap-2 px-3 py-1.5 border border-pink-200 text-pink-600 rounded-md text-xs hover:bg-pink-50 bg-white mr-auto">
            <lucide-icon [img]="Edit2" [size]="14"></lucide-icon>
            <span>تغيير</span>
          </button>
        </div>
      </div>
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">بداية العنوان</span>
        <input type="text" [ngModel]="config().heroTitlePrefix" (ngModelChange)="updateConfig('heroTitlePrefix', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">الكلمة البارزة</span>
        <input type="text" [ngModel]="config().heroTitleHighlight" (ngModelChange)="updateConfig('heroTitleHighlight', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">الوصف الفرعي</span>
        <input type="text" [ngModel]="config().heroSubtitle" (ngModelChange)="updateConfig('heroSubtitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
    </div>
  </div>

  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">نموذج الدخول</div>
    <div class="p-4 space-y-3">
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">عنوان النموذج</span>
        <input type="text" [ngModel]="config().welcomeTitle" (ngModelChange)="updateConfig('welcomeTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">رسالة الترحيب</span>
        <input type="text" [ngModel]="config().welcomeSubtitle" (ngModelChange)="updateConfig('welcomeSubtitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      <label class="flex items-center justify-between">
        <span class="text-sm font-medium">إظهار الدخول بحسابات التواصل</span>
        <input type="checkbox" [ngModel]="config().showSocialLogin" (ngModelChange)="updateConfig('showSocialLogin', $event)" class="lk-checkbox" />
      </label>
    </div>
  </div>

  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium flex justify-between items-center">
      <span>المميزات السفلية</span>
      <app-add-item-button (onClick)="addBenefit()" label="ميزة"></app-add-item-button>
    </div>
    <div class="p-4 space-y-4">
      <div *ngFor="let benefit of config().benefits" class="p-4 bg-muted/30 rounded-xl border border-border space-y-3 relative group">
        <button type="button" (click)="deleteBenefit(benefit.id)" class="absolute top-2 left-2 text-destructive opacity-0 group-hover:opacity-100 transition-opacity">
          <lucide-icon [img]="Trash2" [size]="16"></lucide-icon>
        </button>
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">العنوان</span>
          <input type="text" [ngModel]="benefit.title" (ngModelChange)="updateBenefit(benefit.id, { title: $event })" class="lk-input h-8 px-2 rounded-lg border border-border text-sm" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">السطر الأول</span>
          <input type="text" [ngModel]="benefit.line1" (ngModelChange)="updateBenefit(benefit.id, { line1: $event })" class="lk-input h-8 px-2 rounded-lg border border-border text-sm" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">السطر الثاني</span>
          <input type="text" [ngModel]="benefit.line2" (ngModelChange)="updateBenefit(benefit.id, { line2: $event })" class="lk-input h-8 px-2 rounded-lg border border-border text-sm" />
        </label>
      </div>
    </div>
  </div>
</div>
