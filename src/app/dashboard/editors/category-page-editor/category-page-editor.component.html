<div class="w-full flex flex-col gap-2 pb-24" dir="rtl">
  <div class="text-center mb-4">
    <h2 class="text-xl font-bold text-gray-900 mb-1">إعدادات صفحة المنتجات</h2>
    <p class="text-sm text-gray-500">تحكم في ظهور الفلاتر والترتيب</p>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div class="p-4 space-y-4">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700">عنوان الصفحة</label>
        <input
          type="text"
          class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500"
          [ngModel]="config?.pageTitle || ''"
          (ngModelChange)="updateConfig({ pageTitle: $event })"
          placeholder="مثال: جميع المنتجات"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700">النص الفرعي</label>
        <input
          type="text"
          class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500"
          [ngModel]="config?.pageSubtitle || ''"
          (ngModelChange)="updateConfig({ pageSubtitle: $event })"
          placeholder="اتركه فارغاً لعرض عدد المنتجات"
        />
      </div>
      <hr class="border-gray-100" />
      <div class="flex items-center justify-between">
        <span class="text-sm font-bold text-gray-700">إظهار شريط الفلاتر والتصنيفات</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            class="sr-only peer"
            [ngModel]="config?.showFilterToggle ?? true"
            (ngModelChange)="updateConfig({ showFilterToggle: $event })"
          />
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-pink-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
        </label>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-sm font-bold text-gray-700">إظهار خيار الترتيب (Sort)</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            class="sr-only peer"
            [ngModel]="config?.showSortDropdown ?? true"
            (ngModelChange)="updateConfig({ showSortDropdown: $event })"
          />
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-pink-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
        </label>
      </div>
    </div>
  </div>
</div>
