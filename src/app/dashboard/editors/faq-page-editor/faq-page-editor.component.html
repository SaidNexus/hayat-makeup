<div class="space-y-6 pb-20" dir="rtl">
  <div>
    <h2 class="text-xl font-bold text-gray-900">صفحة الأسئلة الشائعة</h2>
    <p class="text-sm text-gray-500 mt-1">تخصيص الأسئلة والإجابات والنصوص التوضيحية.</p>
  </div>

  <div class="space-y-4">
    <!-- Header Texts -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">النصوص الرئيسية</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">العنوان الرئيسي</label>
          <input
            type="text"
            [ngModel]="config.headerTitle"
            (ngModelChange)="handleChange('headerTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">النص الوصفي الفرعي</label>
          <input
            type="text"
            [ngModel]="config.subtitle"
            (ngModelChange)="handleChange('subtitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">نص البحث الافتراضي (Placeholder)</label>
          <input
            type="text"
            [ngModel]="config.searchPlaceholder"
            (ngModelChange)="handleChange('searchPlaceholder', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- Contact Info -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">بطاقة التواصل</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">عنوان المساعدة</label>
          <input
            type="text"
            [ngModel]="config.contactTitle"
            (ngModelChange)="handleChange('contactTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">نص المساعدة (يمكن استخدام \n لسطر جديد)</label>
          <textarea
            [ngModel]="config.contactSubtitle"
            (ngModelChange)="handleChange('contactSubtitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 min-h-[60px]"
          ></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">نص زر التواصل</label>
          <input
            type="text"
            [ngModel]="config.contactButtonText"
            (ngModelChange)="handleChange('contactButtonText', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- FAQs List -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-semibold text-gray-900">الأسئلة والإجابات</h3>
        <button
          (click)="handleAddFaq()"
          class="flex items-center gap-1 px-3 py-1 bg-pink-50 text-pink-600 rounded-md text-xs font-medium hover:bg-pink-100 transition"
        >
          <lucide-icon [img]="Plus" [size]="14"></lucide-icon> إضافة سؤال
        </button>
      </div>
      
      <div class="space-y-2">
        <ng-container *ngFor="let faq of config.faqs; let index = index">
          <div class="flex items-start gap-3 p-3 rounded-lg border" [ngClass]="editingId() === faq.id ? 'border-blue-300 bg-pink-50/30' : 'border-gray-200 bg-gray-50'">
            <!-- Drag handle -->
            <div class="flex flex-col gap-1 text-gray-400 mt-1 cursor-ns-resize shrink-0">
              <button (click)="handleMoveFaq(index, -1)" class="hover:text-pink-500 disabled:opacity-30" [disabled]="index === 0">
                <lucide-icon [img]="GripVertical" [size]="16"></lucide-icon>
              </button>
              <button (click)="handleMoveFaq(index, 1)" class="hover:text-pink-500 disabled:opacity-30" [disabled]="index === config.faqs.length - 1">
                <lucide-icon [img]="GripVertical" [size]="16"></lucide-icon>
              </button>
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div *ngIf="editingId() === faq.id" class="space-y-2">
                <input
                  type="text"
                  [ngModel]="editQuestion()"
                  (ngModelChange)="editQuestion.set($event)"
                  class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-pink-500"
                  placeholder="السؤال"
                />
                <textarea
                  [ngModel]="editAnswer()"
                  (ngModelChange)="editAnswer.set($event)"
                  class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-pink-500 min-h-[60px]"
                  placeholder="الإجابة"
                ></textarea>
                <div class="flex gap-2">
                  <button (click)="saveEditing()" class="flex items-center gap-1 px-3 py-1 bg-pink-600 text-white rounded text-xs">
                    <lucide-icon [img]="Check" [size]="14"></lucide-icon> حفظ
                  </button>
                  <button (click)="cancelEditing()" class="flex items-center gap-1 px-3 py-1 bg-gray-200 text-gray-700 rounded text-xs">
                    <lucide-icon [img]="X" [size]="14"></lucide-icon> إلغاء
                  </button>
                </div>
              </div>
              
              <div *ngIf="editingId() !== faq.id" [ngClass]="{'opacity-50': !faq.visible}">
                <div class="font-medium text-sm text-gray-900 mb-1">{{ faq.question }}</div>
                <div class="text-xs text-gray-600 truncate">{{ faq.answer }}</div>
              </div>
            </div>

            <!-- Actions -->
            <div *ngIf="editingId() !== faq.id" class="flex items-center gap-1 shrink-0">
              <button
                (click)="handleToggleVisibility(faq.id)"
                class="p-1.5 text-gray-500 hover:text-pink-600 rounded-md hover:bg-white"
                [title]="faq.visible ? 'إخفاء' : 'إظهار'"
              >
                <lucide-icon [img]="faq.visible ? Eye : EyeOff" [size]="16"></lucide-icon>
              </button>
              <button
                (click)="startEditing(faq)"
                class="p-1.5 text-gray-500 hover:text-pink-600 rounded-md hover:bg-white"
                title="تعديل"
              >
                <lucide-icon [img]="Edit2" [size]="16"></lucide-icon>
              </button>
              <button
                (click)="handleDeleteFaq(faq.id)"
                class="p-1.5 text-gray-500 hover:text-red-600 rounded-md hover:bg-white"
                title="حذف"
              >
                <lucide-icon [img]="Trash2" [size]="16"></lucide-icon>
              </button>
            </div>
          </div>
        </ng-container>
        <div *ngIf="config.faqs.length === 0" class="text-center py-6 text-sm text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
          لا توجد أسئلة. انقر على إضافة سؤال للبدء.
        </div>
      </div>
    </div>

  </div>
</div>
