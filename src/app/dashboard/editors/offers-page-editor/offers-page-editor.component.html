<div class="space-y-6 pb-20" dir="rtl">
  <div>
    <h2 class="text-xl font-bold text-gray-900">صفحة العروض</h2>
    <p class="text-sm text-gray-500 mt-1">تخصيص أقسام ونصوص صفحة العروض والتخفيضات.</p>
  </div>

  <div class="space-y-4">
    <!-- Header Texts -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">عناوين الصفحة الأساسية</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">العنوان الرئيسي</label>
          <input
            type="text"
            [ngModel]="config.headerTitle"
            (ngModelChange)="handleChange('headerTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
        
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">عرض البانر العلوي (Hero)</span>
            <span class="text-xs text-gray-500">إظهار الصورة الترويجية في أعلى الصفحة</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.showHero"
              (ngModelChange)="handleChange('showHero', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- Discounts Section -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">قسم التخفيضات</h3>
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">تفعيل القسم</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.showDiscounts"
              (ngModelChange)="handleChange('showDiscounts', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
        
        <div *ngIf="config.showDiscounts">
          <label class="block text-xs font-medium text-gray-700 mb-1">عنوان القسم</label>
          <input
            type="text"
            [ngModel]="config.discountsTitle"
            (ngModelChange)="handleChange('discountsTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- Bundles Section -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">قسم الباقات</h3>
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">تفعيل القسم</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.showBundles"
              (ngModelChange)="handleChange('showBundles', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
        
        <div *ngIf="config.showBundles">
          <label class="block text-xs font-medium text-gray-700 mb-1">عنوان القسم</label>
          <input
            type="text"
            [ngModel]="config.bundlesTitle"
            (ngModelChange)="handleChange('bundlesTitle', $event)"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>
      </div>
    </div>

    <!-- Buy More Section -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">قسم عروض شراء أكثر من قطعة</h3>
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">تفعيل القسم</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.showBuyMore"
              (ngModelChange)="handleChange('showBuyMore', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
        
        <ng-container *ngIf="config.showBuyMore">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">عنوان القسم</label>
            <input
              type="text"
              [ngModel]="config.buyMoreTitle"
              (ngModelChange)="handleChange('buyMoreTitle', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">ملاحظة أسفل القسم</label>
            <input
              type="text"
              [ngModel]="config.buyMoreNote"
              (ngModelChange)="handleChange('buyMoreNote', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Limited Offers Section -->
    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
      <h3 class="font-semibold text-gray-900 border-b pb-2">قسم العروض محدودة المدة</h3>
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
          <div class="flex flex-col">
            <span class="text-sm font-medium text-gray-900">تفعيل القسم</span>
          </div>
          <div class="relative inline-flex items-center">
            <input 
              type="checkbox" 
              class="sr-only peer" 
              [ngModel]="config.showLimitedOffers"
              (ngModelChange)="handleChange('showLimitedOffers', $event)"
            />
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-pink-600"></div>
          </div>
        </label>
        
        <ng-container *ngIf="config.showLimitedOffers">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">عنوان القسم</label>
            <input
              type="text"
              [ngModel]="config.limitedOffersTitle"
              (ngModelChange)="handleChange('limitedOffersTitle', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">نص الخصم بالبطاقة</label>
            <input
              type="text"
              [ngModel]="config.limitedOfferDiscountLabel"
              (ngModelChange)="handleChange('limitedOfferDiscountLabel', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">نص الزر</label>
            <input
              type="text"
              [ngModel]="config.limitedOfferButtonText"
              (ngModelChange)="handleChange('limitedOfferButtonText', $event)"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
        </ng-container>
      </div>
    </div>

  </div>
</div>
