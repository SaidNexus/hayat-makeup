<div class="space-y-4">
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">النصوص الأساسية</div>
    <div class="p-4 space-y-4">
      <div class="space-y-3 p-4">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">عنوان الصفحة</span>
          <input type="text" [ngModel]="config().pageTitle" (ngModelChange)="updateConfig('pageTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium">نص الحالة الفارغة</span>
          <input type="text" [ngModel]="config().emptyStateTitle" (ngModelChange)="updateConfig('emptyStateTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
        </label>
      </div>
    </div>
  </div>
</div>
