<div class="space-y-4">
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">رأس الصفحة</div>
    <div class="p-4 space-y-3">
      <div class="flex flex-col gap-1.5 mb-3">
        <span class="text-sm font-medium">صورة البانر</span>
        <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-100">
          <div class="w-16 h-16 rounded-md overflow-hidden flex items-center justify-center bg-gray-200">
            <img *ngIf="config.bannerImage" [src]="config.bannerImage" alt="Banner" class="w-full h-full object-cover" />
            <lucide-icon *ngIf="!config.bannerImage" [img]="ImageIcon" class="text-gray-400"></lucide-icon>
          </div>
          <button (click)="changeBanner()" class="flex items-center gap-2 px-3 py-1.5 border border-pink-200 text-pink-600 rounded-md text-xs hover:bg-pink-50 bg-white mr-auto">
            <lucide-icon [img]="Edit2" [size]="14"></lucide-icon>
            <span>تغيير</span>
          </button>
        </div>
      </div>
      
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">العنوان</span>
        <input type="text" [ngModel]="config.pageTitle" (ngModelChange)="updateConfig('pageTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">الوصف</span>
        <input type="text" [ngModel]="config.pageSubtitle" (ngModelChange)="updateConfig('pageSubtitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
    </div>
  </div>
  
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium flex justify-between items-center">
      <span>طرق التواصل</span>
      <app-add-item-button (onClick)="addMethod()" label="طريقة"></app-add-item-button>
    </div>
    
    <div class="p-4 space-y-4">
      <div *ngFor="let m of config.contactMethods" class="p-4 bg-muted/30 rounded-xl border border-border space-y-3 relative group">
        <button type="button" (click)="deleteMethod(m.id)" class="absolute top-2 left-2 text-destructive opacity-0 group-hover:opacity-100">
          <lucide-icon [img]="Trash2" [size]="16"></lucide-icon>
        </button>
        
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">العنوان</span>
          <input type="text" [ngModel]="m.title" (ngModelChange)="updateMethod(m.id, { title: $event })" class="lk-input h-8 px-2 rounded-lg border border-border text-sm" />
        </label>
        
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">القيمة</span>
          <input type="text" [ngModel]="m.value" (ngModelChange)="updateMethod(m.id, { value: $event })" class="lk-input h-8 px-2 rounded-lg border border-border text-sm" />
        </label>
      </div>
    </div>
  </div>
  
  <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
    <div class="p-4 bg-muted/30 border-b border-border font-medium">نموذج المراسلة</div>
    <div class="p-4 space-y-3">
      <label class="flex items-center justify-between">
        <span class="text-sm font-medium">إظهار النموذج</span>
        <input type="checkbox" [ngModel]="config.showContactForm" (ngModelChange)="updateConfig('showContactForm', $event)" class="lk-checkbox" />
      </label>
      
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">عنوان النموذج</span>
        <input type="text" [ngModel]="config.formTitle" (ngModelChange)="updateConfig('formTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
      
      <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">وصف النموذج</span>
        <input type="text" [ngModel]="config.formSubtitle" (ngModelChange)="updateConfig('formSubtitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" />
      </label>
    </div>
  </div>
</div>
