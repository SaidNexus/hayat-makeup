<div class="w-full flex flex-col gap-2 pb-24" dir="rtl">
  <div class="text-center mb-4">
    <h2 class="text-xl font-bold text-gray-900 mb-1">شبكة المنتجات</h2>
    <p class="text-sm text-gray-500">إدارة صفحة "كل المشدات"</p>
  </div>

  <app-section-card 
    title="رأس الصفحة" 
    [index]="0" 
    [enabled]="true" 
    [isFirst]="true" 
    [isLast]="false" 
    (onToggle)="noop()"
    (onDuplicate)="noop()" (onDelete)="noop()" (onMoveUp)="noop()" (onMoveDown)="noop()" (onDragStart)="noop()" (onDragEnd)="noop()" (onDragOver)="noop()" (onDrop)="noop()">
    
    <div class="flex flex-col gap-1.5 mb-3">
      <span class="text-xs font-bold text-gray-700">العنوان الرئيسي</span>
      <input type="text" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500" 
        [ngModel]="config.headerTitle || ''" 
        (ngModelChange)="updateConfig({ headerTitle: $event })" />
    </div>
  </app-section-card>

  <app-section-card 
    title="تفاصيل بطاقة المنتج" 
    [index]="1" 
    [enabled]="true" 
    [isFirst]="false" 
    [isLast]="false" 
    (onToggle)="noop()"
    (onDuplicate)="noop()" (onDelete)="noop()" (onMoveUp)="noop()" (onMoveDown)="noop()" (onDragStart)="noop()" (onDragEnd)="noop()" (onDragOver)="noop()" (onDrop)="noop()">
    
    <div class="flex items-center gap-2 mb-2">
      <input type="checkbox" [ngModel]="config.showRating" (ngModelChange)="updateConfig({ showRating: $event })" class="rounded text-pink-600 focus:ring-pink-500" />
      <span class="text-sm font-medium">إظهار النجوم (التقييم)</span>
    </div>
    
    <div class="flex items-center gap-2 mb-2">
      <input type="checkbox" [ngModel]="config.showReviewsCount" (ngModelChange)="updateConfig({ showReviewsCount: $event })" class="rounded text-pink-600 focus:ring-pink-500" />
      <span class="text-sm font-medium">إظهار عدد التقييمات</span>
    </div>
    
    <div class="flex items-center gap-2 mb-2">
      <input type="checkbox" [ngModel]="config.showOriginalPrice" (ngModelChange)="updateConfig({ showOriginalPrice: $event })" class="rounded text-pink-600 focus:ring-pink-500" />
      <span class="text-sm font-medium">إظهار السعر قبل الخصم (إذا وُجد)</span>
    </div>
  </app-section-card>

  <app-section-card 
    title="حالة عدم وجود نتائج" 
    [index]="2" 
    [enabled]="true" 
    [isFirst]="false" 
    [isLast]="true" 
    (onToggle)="noop()"
    (onDuplicate)="noop()" (onDelete)="noop()" (onMoveUp)="noop()" (onMoveDown)="noop()" (onDragStart)="noop()" (onDragEnd)="noop()" (onDragOver)="noop()" (onDrop)="noop()">
    
    <div class="flex flex-col gap-1.5 mb-3">
      <span class="text-xs font-bold text-gray-700">العنوان</span>
      <input type="text" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500" 
        [ngModel]="config.emptyTitle || ''" 
        (ngModelChange)="updateConfig({ emptyTitle: $event })" />
    </div>
    
    <div class="flex flex-col gap-1.5 mb-3">
      <span class="text-xs font-bold text-gray-700">النص</span>
      <input type="text" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500" 
        [ngModel]="config.emptyText || ''" 
        (ngModelChange)="updateConfig({ emptyText: $event })" />
    </div>
    
    <div class="flex flex-col gap-1.5 mb-3">
      <span class="text-xs font-bold text-gray-700">نص زر العودة</span>
      <input type="text" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-md px-3 py-2 outline-none focus:border-pink-500" 
        [ngModel]="config.emptyCta || ''" 
        (ngModelChange)="updateConfig({ emptyCta: $event })" />
    </div>
  </app-section-card>
</div>
