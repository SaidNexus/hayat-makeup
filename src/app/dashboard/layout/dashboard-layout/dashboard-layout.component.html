<div class="dashboard-home dashboard-layout-page" dir="rtl">
  <header class="dashboard-home__header dashboard-layout-page__header">
    <button
      type="button"
      class="dashboard-home__menu"
      (click)="isSidebarOpen = true"
      aria-label="فتح القائمة"
    >
      <lucide-icon [img]="Menu" [size]="27" [strokeWidth]="2"></lucide-icon>
    </button>
    <div class="dashboard-home__brand" aria-label="HAYAT MAKEUP">
      <span class="dashboard-home__brand-primary font-black tracking-wider">HAYAT</span>
      <span class="dashboard-home__brand-secondary font-black tracking-wider text-[#D4146A]">MAKEUP</span>
    </div>
    <div class="dashboard-home__header-actions" aria-label="روابط المتجر">
      <button type="button" (click)="router.navigate(['/'])">الذهاب للمتجر</button>
    </div>
  </header>

  <main class="dashboard-layout-page__content">
    <ng-content></ng-content>
  </main>

  <div *ngIf="isSidebarOpen" class="dashboard-sidebar-layer">
    <button
      type="button"
      class="dashboard-sidebar-layer__backdrop"
      (click)="closeSidebar()"
      aria-label="إغلاق القائمة"
    ></button>
    <aside class="dashboard-sidebar" dir="rtl" aria-label="القائمة الجانبية للوحة التحكم">
      <header class="dashboard-sidebar__hero">
        <button
          type="button"
          class="dashboard-sidebar__avatar"
          aria-label="صورة الحساب"
        >
          <img *ngIf="activeAccount.avatar" [src]="activeAccount.avatar" [alt]="activeAccount.name" />
          <span *ngIf="!activeAccount.avatar">{{ initials(activeAccount.name) }}</span>
        </button>
        <div class="dashboard-sidebar__identity dashboard-sidebar__identity--name-only">
          <strong>{{ activeAccount.name }}</strong>
        </div>
      </header>

      <ng-container *ngIf="sidebarView === 'menu'">
        <nav class="dashboard-sidebar__nav">
          <div class="dashboard-sidebar__nav-group">
            <button
              type="button"
              class="dashboard-sidebar__nav-row is-active"
              (click)="router.navigate(['/admin']); closeSidebar()"
            >
              <span class="dashboard-sidebar__nav-main">
                <lucide-icon [img]="LayoutDashboard" [size]="17"></lucide-icon>
                <span>إدارة وتخصيص المتجر</span>
              </span>
              <lucide-icon [img]="ChevronLeft" [size]="15"></lucide-icon>
            </button>

            <button
              type="button"
              class="dashboard-sidebar__nav-row"
              (click)="router.navigate(['/']); closeSidebar()"
            >
              <span class="dashboard-sidebar__nav-main">
                <lucide-icon [img]="Store" [size]="17"></lucide-icon>
                <span>الذهاب إلى المتجر الرئيسي</span>
              </span>
              <lucide-icon [img]="ChevronLeft" [size]="15"></lucide-icon>
            </button>
          </div>
        </nav>
      </ng-container>

      <button type="button" class="dashboard-sidebar__logout" (click)="logout()">
        <span>خروج</span>
        <lucide-icon [img]="LogOut" [size]="17"></lucide-icon>
      </button>
    </aside>
  </div>
</div>
